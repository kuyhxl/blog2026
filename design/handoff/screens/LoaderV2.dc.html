<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로딩 층 (v2)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* 로딩 층. 화면 위에 얹어 쓰는 층이라 토큰을 따로 갖는다(v2 화면과 같은 값: 라이트 / 다크) */
.ld{--bg:#E3ECE4;--panel:#F3F7F2;--ink:#141A16;--ink-2:#38423B;--ink-3:#525D55;--line:rgba(20,26,22,.2);--line-2:rgba(20,26,22,.4);--pine-1:#7DAA6B;--pine-2:#4D8553;--pine-3:#2E5B3E;--bark-1:#6B5142;--bark-2:#43322A;--hover:rgba(20,26,22,.06);--sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--cell:4px;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.ld.dark{--bg:#162119;--panel:#1F2D23;--ink:#E3ECE4;--ink-2:#B7C3BA;--ink-3:#9AA79D;--line:rgba(227,236,228,.17);--line-2:rgba(227,236,228,.34);--pine-1:#4E7767;--pine-2:#35584B;--pine-3:#243E36;--bark-1:#4F463E;--bark-2:#3B322C;--hover:rgba(227,236,228,.07);color-scheme:dark}
.ld *,.ld *::before,.ld *::after{box-sizing:border-box}
.ld .mono{font-family:var(--mono);font-size:12px;line-height:1;letter-spacing:.04em;text-transform:uppercase}

/* 한 칸의 크기(--cell)는 화면의 소나무와 같다: 넓은 화면 4px, 좁은 화면(720px 미만) 2px. 늘 정수 픽셀이어서 칸이 또렷하다.
   나무 사이(--gap)는 8칸. 2px일 때 네 그루의 너비는 4×64 + 3×16 = 304px이어서 휴대폰에서도 한 줄에 들어간다.
   360px보다 좁은 화면에서는 나무 사이만 4칸으로 좁힌다(280px) */
.ld{--gap:8}
@media (max-width:719px){.ld{--cell:2px}}
@media (max-width:359px){.ld{--gap:4}}
.ld.mobile{--cell:2px}

/* 그림: 칸마다 1×1 사각형. 색은 변수로 준다(화면의 소나무, 파비콘과 같은 방식). 흐림도 반투명도 없다.
   한 자리의 svg에 모든 프레임의 칸이 들어 있고, svg의 클래스가 어느 칸을 보일지 고른다.
   s0~s3 = 솔씨에서 솔방울까지의 네 장, sp = 화분 위에 얹힌 솔방울, b1~b5 = 분재의 칸이 나타나는 순서(쌓인다) */
.ld-tree{display:block;flex:none;width:calc(32*var(--cell));height:calc(32*var(--cell))}
.ld-tree rect{display:none}
.ld-tree .p1{fill:var(--pine-1)}
.ld-tree .p2{fill:var(--pine-2)}
.ld-tree .p3{fill:var(--pine-3)}
.ld-tree .k1{fill:var(--bark-1)}
.ld-tree .k2{fill:var(--bark-2)}
.ld-tree.s0 .q0,.ld-tree.s1 .q1,.ld-tree.s2 .q2,.ld-tree.s3 .q3,.ld-tree.sp .qp,.ld-tree.b1 .o1,.ld-tree.b2 .o2,.ld-tree.b3 .o3,.ld-tree.b4 .o4,.ld-tree.b5 .o5,.ld-tree.all rect{display:inline}

/* 네 자리의 묶음: 가로는 가운데, 세로는 나무의 한가운데가 화면 높이의 47% 자리(가운데보다 조금 위).
   묶음의 너비 = 4×32칸 + 3×나무 사이. 놓는 자리는 한 칸의 배수로 맞춘다. 그래야 그림의 모든 칸이 화면의 픽셀에 딱 맞고,
   화면 배율이 125%, 150%인 컴퓨터에서도 4px 칸이 고르게 그려진다(round()를 모르는 브라우저는 맞추지 않고 같은 자리에 놓는다) */
.ld-group{position:absolute;left:calc(50% - (64 + 1.5*var(--gap))*var(--cell));top:calc(47% - 16*var(--cell));display:flex;flex-direction:column}
@supports (width:round(1px,1px)){.ld-group{left:round(calc(50% - (64 + 1.5*var(--gap))*var(--cell)),var(--cell));top:round(calc(47% - 16*var(--cell)),var(--cell))}}
.ld-spots{display:flex;align-items:flex-end;gap:calc(var(--gap)*var(--cell))}
.ld-shelf{height:1px;margin:0 calc(-6*var(--cell));background:var(--line-2)}

/* 층은 둘로 되어 있다. 바깥(.ld-cover)은 보이지 않고 화면 전체에서 누름과 키를 받는다. 안쪽(.ld-veil)이 바탕색과 그림이고, 걷힐 때 이것만 잘린다.
   그래서 걷히는 동안에도 누름은 바깥이 받고, 건너뛰려고 누른 것이 뒤 화면의 링크나 단추로 넘어가지 않는다.
   다 걷혔는데 아직 누르고 있으면 바깥은 손을 뗄 때까지 남는다 */
.ld-cover{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.ld-cover:focus,.ld-cover:focus-visible{outline:none}
/* 덮고 있는 동안 뒤 화면은 스크롤되지 않는다 */
body:has(.ld-on){overflow:hidden}
/* 이 부품만 따로 볼 때 뒤에 놓이는 단추 */
.ld-again{height:44px;padding:0 18px;margin:0;border:1px solid var(--ink);border-radius:0;background:none;color:var(--ink);font:inherit;font-size:14px;line-height:1;cursor:pointer}
.ld-again:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (hover:hover){.ld-again:hover{background:var(--hover)}}

/* 정지 화면: 두 배로 확대(한 칸 8px). 창이 좁으면 6px, 4px로 줄고, 720px보다 좁으면 두 줄로 나눈다 */
.ld-still{--cell:8px}
.ld-still .ld-row{--cols:4;display:grid;grid-template-columns:repeat(var(--cols),calc(32*var(--cell)));column-gap:calc(8*var(--cell));justify-content:center}
@media (max-width:1279px){.ld-still{--cell:6px}}
@media (max-width:999px){.ld-still{--cell:4px}}
@media (max-width:719px){.ld-still .ld-row{--cols:2;row-gap:28px}}
@media (max-width:359px){.ld-still{--cell:3px}}
@supports (width:round(down,1px,1px)){.ld-still .ld-row{justify-content:start;padding-left:round(down,calc((100% - (var(--cols)*40 - 8)*var(--cell))/2),1px)}}

/* 프레임 표: 한 칸 4px(데스크톱 로딩 화면과 같은 크기). 좁으면 표만 옆으로 스크롤한다 */
.ld-frames{--cell:4px}
.ld-frames .ld-sheet{display:grid;grid-template-columns:112px repeat(9,calc(32*var(--cell)));column-gap:8px;row-gap:0;align-items:end;width:max-content}
</style>
</helmet>
<div class="ld {{rootCls}}">

  <sc-if value="{{isCover}}" hint-placeholder-val="{{ false }}">
    <sc-if value="{{solo}}" hint-placeholder-val="{{ false }}">
      <div style="min-height: 100vh; padding: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: var(--panel)">
        <span style="font-size: 15px; line-height: 22px; color: var(--ink-2); text-align: center">사이트 화면이 놓이는 자리</span>
        <button type="button" class="ld-again" onClick="{{again}}">다시 재생</button>
      </div>
    </sc-if>
    <sc-if value="{{covering}}" hint-placeholder-val="{{ false }}">
      <div class="ld-cover ld-on" role="img" aria-label="시작 화면. 소나무 분재 네 그루가 자랍니다. 화면을 누르거나 아무 키나 누르면 건너뜁니다" tabIndex="-1" ref="{{setCover}}" onPointerDown="{{onDown}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" onLostPointerCapture="{{onUp}}" onClick="{{onClick}}" onKeyDown="{{onKey}}" style="position: fixed; inset: 0; z-index: 100">
        <sc-if value="{{veil}}" hint-placeholder-val="{{ true }}">
          <div class="ld-veil" style="position: absolute; inset: 0; background: var(--bg); clip-path: {{clip}}">
            <div class="ld-group">
              <div class="ld-spots">
                <sc-for list="{{trees}}" as="t" hint-placeholder-count="4">
                  <svg class="ld-tree {{t.fc}}" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true"><sc-for list="{{t.small}}" as="c" hint-placeholder-count="0"><rect class="{{c.k}}" width="1" height="1" style="transform: translate({{c.x}}px, {{c.y}}px)"></rect></sc-for><sc-for list="{{t.plant}}" as="c" hint-placeholder-count="0"><rect class="{{c.k}}" width="1" height="1" style="transform: translate({{c.x}}px, {{c.y}}px)"></rect></sc-for><sc-for list="{{t.cells}}" as="c" hint-placeholder-count="0"><rect class="{{c.k}}" width="1" height="1" style="transform: translate({{c.x}}px, {{c.y}}px)"></rect></sc-for></svg>
                </sc-for>
              </div>
              <div class="ld-shelf" aria-hidden="true"></div>
              <sc-if value="{{labels}}" hint-placeholder-val="{{ false }}">
                <div aria-hidden="true" style="display: flex; gap: calc(var(--gap) * var(--cell)); margin-top: 10px">
                  <sc-for list="{{trees}}" as="t" hint-placeholder-count="4">
                    <span style="width: calc(32 * var(--cell)); font-family: var(--mono); font-size: 11px; line-height: 1; text-align: center; color: var(--ink-3)">{{t.fi}}</span>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-if>
  </sc-if>

  <sc-if value="{{isStill}}" hint-placeholder-val="{{ false }}">
    <div class="ld-still" style="min-height: 100vh; padding: 136px 32px 64px; background: var(--bg)">
      <div class="ld-row">
        <sc-for list="{{stills}}" as="t" hint-placeholder-count="4">
          <figure style="margin: 0; min-width: 0">
            <svg class="ld-tree all" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="{{t.name}}"><sc-for list="{{t.cells}}" as="c" hint-placeholder-count="0"><rect class="{{c.k}}" width="1" height="1" style="transform: translate({{c.x}}px, {{c.y}}px)"></rect></sc-for></svg>
            <div aria-hidden="true" style="height: 1px; margin: 0 calc(-4 * var(--cell)); background: var(--line-2)"></div>
            <figcaption style="height: 20px; margin-top: 16px; display: flex; align-items: baseline; gap: 10px; white-space: nowrap">
              <span class="mono" style="color: var(--ink-3)">[ {{t.no}} ]</span>
              <span style="font-size: 15px; line-height: 20px; font-weight: 500">{{t.name}}</span>
            </figcaption>
          </figure>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isFrames}}" hint-placeholder-val="{{ false }}">
    <div class="ld-frames" style="min-height: 100vh; padding: 48px 40px 56px; background: var(--bg)">
      <div style="min-height: 34px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px; padding-bottom: 20px; border-bottom: 1px solid var(--ink)">
        <div style="height: 34px; display: flex; align-items: baseline; gap: 14px">
          <span class="mono" style="color: var(--ink-3)">[ Loading ]</span>
          <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 400; letter-spacing: -0.02em">프레임</h1>
        </div>
        <span style="font-family: var(--mono); font-size: 12px; line-height: 18px; color: var(--ink-2)">{{timeLine}}</span>
      </div>
      <div style="margin-top: 28px; overflow-x: auto">
        <div class="ld-sheet">
          <span></span>
          <sc-for list="{{heads}}" as="h" hint-placeholder-count="9">
            <div style="padding-bottom: 12px; display: flex; flex-direction: column; gap: 6px">
              <span class="mono" style="font-size: 11px; line-height: 11px">{{h.no}}</span>
              <span style="font-size: 13px; line-height: 16px; white-space: nowrap">{{h.name}}</span>
              <span style="font-family: var(--mono); font-size: 11px; line-height: 11px; color: var(--ink-3)">{{h.ms}}</span>
            </div>
          </sc-for>
          <sc-for list="{{sheet}}" as="t" hint-placeholder-count="4">
            <div style="align-self: center; display: flex; flex-direction: column; gap: 6px; padding-right: 8px">
              <span class="mono" style="font-size: 11px; color: var(--ink-3)">[ {{t.no}} ]</span>
              <span style="font-size: 14px; line-height: 1.3; font-weight: 500; word-break: keep-all">{{t.name}}</span>
            </div>
            <sc-for list="{{t.frames}}" as="fr" hint-placeholder-count="9">
              <div style="padding-top: 12px; padding-bottom: 20px">
                <svg class="ld-tree all" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true"><sc-for list="{{fr.cells}}" as="c" hint-placeholder-count="0"><rect class="{{c.k}}" width="1" height="1" style="transform: translate({{c.x}}px, {{c.y}}px)"></rect></sc-for></svg>
                <div aria-hidden="true" style="height: 1px; background: var(--line-2)"></div>
              </div>
            </sc-for>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"device":{"editor":"enum","options":["desktop","mobile"],"default":"desktop"},"mode":{"editor":"enum","options":["cover","still","frames"],"default":"cover"},"slow":{"editor":"boolean","default":false},"once":{"editor":"boolean","default":false},"reduce":{"editor":"boolean","default":false},"run":{"editor":null,"default":0},"onDone":{"editor":null},"onPlay":{"editor":null},"onReady":{"editor":null},"$preview":{"width":880,"height":560}}'>
// 로딩 층: 사이트에 처음 들어올 때 화면을 덮었다가 걷히는 층.
// 솔씨 넷 → (왼쪽부터) 솔방울 → (왼쪽부터) 화분에 담긴 분재 → 잠시 멈춤 → 걷힘.
// 사이트 내용은 이 층 뒤에서 이미 그려져 있다. 이 층은 그 위를 덮고 있다가 사라질 뿐이다.
//
// 쓰는 값(props)
//   theme   light | dark
//   device  desktop | mobile (mobile이면 한 칸을 2px로 고정)
//   mode    cover(덮는 층) | still(네 그루를 확대한 정지 화면) | frames(프레임 표)
//   run     숫자가 바뀌면 처음부터 다시 재생한다(다시 재생 버튼)
//   slow    느리게 보기(TIME.slow배)
//   once    세션에서 한 번만 보여 준다. 실제 사이트에서는 켠다. 캔버스에서는 열 때마다 보도록 꺼 두었다
//   reduce  운영체제의 "동작 줄이기"가 켜진 것처럼 움직인다(확인용)
//   onDone  층이 사라졌을 때 부르는 함수. { skipped }를 넘긴다: 처음부터 보여 주지 않았으면 그 까닭('reduce' | 'once'), 아니면 ''
//   onPlay  재생을 시작할 때 부르는 함수
//   onReady 이 층이 자리를 잡았을 때 부르는 함수. { total, slow }(전체 길이 ms, 느리게 보기 배율)를 넘긴다
//
// 동작 규칙
//   · 화면을 누르거나 아무 키나 누르면 그 자리에서 바로 걷히기 시작한다. 그 누름과 키는 뒤 화면으로 넘어가지 않는다.
//   · 운영체제의 "동작 줄이기"가 켜져 있으면 처음부터 보여 주지 않는다.
//   · once가 켜져 있으면 세션에서 처음 한 번만 보여 준다(sessionStorage). 페이지를 옮겨 다닐 때는 나오지 않는다.
//     끝까지 보았을 때와 건너뛰었을 때 "보았다"고 적어 둔다.
//   · 구현할 때: 이 층은 서버에서부터 그려 두어야 사이트가 먼저 비치지 않는다. 이미 본 세션과 동작 줄이기는
//     head의 짧은 스크립트나 CSS로 걸러 처음부터 숨긴다. 키 입력은 window에서 한 번 듣고, 다 걷히면 층을 없앤다.
//     (이 화면은 캔버스 규칙 때문에 층이 포커스를 가진 동안에만 키를 듣는다)

// ── 길이를 조절하는 값: 전부 여기에 있다(단위 ms) ─────────────────────────────
// 전체 길이 = seedHold + 3×stagger + 3×coneFrame + between + 3×stagger + 5×growFrame + endHold + lift
//           = 100 + 450 + 150 + 0 + 450 + 250 + 150 + 300 = 1850. 2초를 넘지 않게 한다
//             (화면이 처음 뜰 때 잠깐 버벅이면 그만큼 늦게 끝나므로 2초까지 여유를 둔다)
// 모든 값을 50ms의 배수로 두었다. 50ms는 60Hz 화면이 세 번 그려지는 시간이어서, 이 배수로 두면 프레임 간격이 고르다
const TIME = {
  seedHold: 100, // 솔씨 넷이 놓인 채로 머무는 시간
  stagger: 150,  // 나무 사이의 시차. 왼쪽 나무가 먼저 시작한다
  coneFrame: 50, // 솔씨 → 솔방울: 한 프레임이 보이는 시간(3프레임)
  between: 0,    // 넷이 모두 솔방울이 된 뒤, 첫 나무가 자라기 시작할 때까지
  growFrame: 50, // 솔방울 → 분재: 한 프레임이 보이는 시간(5프레임)
  endHold: 150,  // 네 그루가 다 자란 뒤, 걷히기 시작할 때까지 멈춰 있는 시간
  lift: 300,     // 화면이 걷히는 시간
  liftSteps: 6,  // 걷힐 때의 계단 수. 아래쪽부터 화면 높이의 1/6씩, lift/liftSteps(50ms)마다 한 계단 걷힌다
  slow: 5,       // 느리게 보기의 배율
};
const SPOTS = 4;        // 자리 수
const CONE_FRAMES = 3;  // 솔씨 → 솔방울: 프레임 1, 2, 3
const GROW_FRAMES = 5;  // 솔방울 → 분재: 프레임 4, 5, 6, 7, 8
const LAST = CONE_FRAMES + GROW_FRAMES; // 다 자란 프레임(8)
const FRAME_CAP = 34;    // 한 번 그릴 때 시계가 갈 수 있는 최대 시간(ms)
const SLACK = 2;         // 프레임이 바뀔 때가 2ms 안으로 다가왔으면 이번에 바꾼다(다음 그리기까지 미루지 않는다)
const HELD_AFTER_UP = 250; // 손을 뗀 뒤 따라오는 click을 이만큼 기다린다(ms). click이 오면 바로 놓는다
const HELD_MAX = 3000;     // 다 걷힌 뒤에도 누르고 있을 때, 받는 층을 남겨 두는 최대 시간(ms). 손을 뗀 것을 놓쳤을 때를 위한 안전장치
const SEEN_KEY = 'blog2026:loader-shown';

// i번째 자리(0이 왼쪽)가 솔방울로 바뀌기 시작하는 때, 자라기 시작하는 때
const coneAt = (i) => TIME.seedHold + i * TIME.stagger;
const CONES_DONE = coneAt(SPOTS - 1) + CONE_FRAMES * TIME.coneFrame;
const growAt = (i) => CONES_DONE + TIME.between + i * TIME.stagger;
const GROWN = growAt(SPOTS - 1) + GROW_FRAMES * TIME.growFrame;
const LIFT_AT = GROWN + TIME.endHold;
const TOTAL = LIFT_AT + TIME.lift;
// t(ms)에 i번째 자리가 보여 주는 프레임(0~8)
function frameAt(i, t) {
  if (t < coneAt(i)) return 0;
  if (t < growAt(i)) return Math.min(CONE_FRAMES, 1 + Math.floor((t - coneAt(i)) / TIME.coneFrame));
  return Math.min(LAST, CONE_FRAMES + 1 + Math.floor((t - growAt(i)) / TIME.growFrame));
}

// p1 p2 p3 = --pine-1 --pine-2 --pine-3, k1 k2 = --bark-1 --bark-2 (화면의 소나무, 파비콘과 같은 이름)
const INK = { 1: 'p1', 2: 'p2', 3: 'p3', a: 'k1', b: 'k2' };
function cellsOf(rows, x0, y0, tag) {
  const out = [];
  rows.forEach((row, dy) => {
    for (let dx = 0; dx < row.length; dx++) if (row[dx] !== '.') out.push({ x: x0 + dx, y: y0 + dy, k: (typeof tag === 'function' ? tag(dx, dy) : tag) + ' ' + INK[row[dx]] });
  });
  return out;
}
// 솔씨에서 솔방울까지의 네 장: 한 자리(32칸)의 가운데, 바닥선 위에 놓는다
const SMALL = [SEED, BUD, CONE_S, CONE];
const SMALL_X = 8;
const SMALL_CELLS = SMALL.reduce((all, rows, f) => all.concat(cellsOf(rows, SMALL_X, 32 - rows.length, 'q' + f)), []);
const PLANT_ROWS = CONE.slice(0, CONE_TOP);
const SPRITES = TREES.map((t) => ({
  name: t.name,
  cells: cellsOf(t.grid, 0, 0, (x, y) => 'o' + t.order[y][x]),
  plant: cellsOf(PLANT_ROWS, t.plant[0], t.plant[1], 'qp'),
}));
// 프레임 f(0~8)에서 실제로 보이는 칸만 고른 목록(정지 화면과 프레임 표에 쓴다)
function shown(i, f) {
  if (f <= CONE_FRAMES) return cellsOf(SMALL[f], SMALL_X, 32 - SMALL[f].length, 'q' + f);
  const n = f - CONE_FRAMES;
  const base = SPRITES[i].cells.filter((c) => Number(c.k[1]) <= n);
  return n === 1 ? SPRITES[i].plant.concat(base) : base;
}
// svg에 붙이는 프레임 클래스
const FRAME_CLASS = ['s0', 's1', 's2', 's3', 'sp b1', 'b1 b2', 'b1 b2 b3', 'b1 b2 b3 b4', 'b1 b2 b3 b4 b5'];
const HEADS = [

  ['화분', TIME.growFrame], ['줄기', TIME.growFrame], ['줄기 · 잎', TIME.growFrame], ['잎', TIME.growFrame], ['다 자람', TIME.growFrame],
];
const two = (n) => (n < 10 ? '0' : '') + n;

// 이미 본 세션인가. 저장소를 못 쓰는 곳에서는 이 문서가 살아 있는 동안만 기억한다
let seenHere = false;
function seen() { try { return window.sessionStorage.getItem(SEEN_KEY) === '1'; } catch (e) { return seenHere; } }
function markSeen() { seenHere = true; try { window.sessionStorage.setItem(SEEN_KEY, '1'); } catch (e) { /* 저장소를 못 쓰면 넘어간다 */ } }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    // f: 자리마다 보여 주는 프레임. step: 걷힌 계단 수
    // phase: play(재생) | lift(걷히는 중) | held(다 걷혔지만 아직 누르고 있어서 받는 층만 남음) | done(걷힘)
    //        | poster(캔버스에서 편집하는 동안의 정지 모습)
    const start = this.editing() ? 'poster' : this.blocked() ? 'done' : 'play';
    this.state = { f: start === 'poster' ? [LAST, LAST, LAST, LAST] : [0, 0, 0, 0], phase: start, step: 0 };
    this.raf = 0;
    this.setCover = (el) => { this.coverEl = el; if (el) this.grab(); };
    // 누르면 건너뛴다. 누르고 있는 동안에는(this.held) 다 걷혀도 받는 층을 남겨 둔다:
    // 손을 뗄 때 생기는 click이 뒤 화면의 링크나 단추로 가지 않게 하려는 것이다
    this.onDown = (e) => {
      if (this.editing()) return;
      this.held = true;
      clearTimeout(this.upT);
      // 층 밖에서 손을 떼어도 이 층이 알 수 있게 한다
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* 못 잡아도 괜찮다: HELD_MAX가 지나면 놓는다 */ }
      this.skip();
    };
    this.onUp = () => { clearTimeout(this.upT); this.upT = setTimeout(this.letGo, HELD_AFTER_UP); };
    this.onClick = () => { this.letGo(); };
    this.letGo = () => {
      clearTimeout(this.upT);
      clearTimeout(this.heldT);
      if (!this.held) return;
      this.held = false;
      if (this.state.phase === 'held') this.close();
    };
    this.again = () => { if (!this.editing()) this.play(true); };
    this.onKey = (e) => {
      // 아무 키나 건너뛴다. Tab과 조합 키는 제 할 일을 하게 두고, 나머지는 뒤 화면의 단축키로 새지 않게 막는다
      if (e.key !== 'Tab' && !e.metaKey && !e.ctrlKey && !e.altKey) e.preventDefault();
      e.stopPropagation();
      this.skip();
    };
    this.tick = () => {
      this.raf = 0;
      // 시계는 화면이 그려질 때마다 흐른 만큼만 간다. 한 번에 FRAME_CAP보다 많이 가지 않으므로,
      // 화면이 잠깐 멈췄다 돌아와도 프레임을 건너뛰지 않는다(그만큼 늦게 끝난다)
      const now = performance.now();
      this.clock += Math.min(now - this.last, FRAME_CAP) / this.speed;
      this.last = now;
      const t = this.clock;
      if (t >= this.cut + TIME.lift) { this.finish(); return; }
      const at = Math.min(t, this.cut);
      const f = [];
      for (let i = 0; i < SPOTS; i++) f.push(frameAt(i, at + SLACK));
      const lifting = t >= this.cut;
      const step = lifting ? Math.min(TIME.liftSteps - 1, Math.floor((t - this.cut) / (TIME.lift / TIME.liftSteps))) : 0;
      const sig = f.join('') + (lifting ? 'L' : 'P') + step;
      if (sig !== this.sig) { this.sig = sig; this.setState({ f, phase: lifting ? 'lift' : 'play', step }); }
      this.raf = requestAnimationFrame(this.tick);
    };
  }

  componentDidMount() {
    if (!this.isCover()) return;
    this.lastRun = this.props.run;
    this.lastSlow = !!this.props.slow;
    // 캔버스에서 편집과 재생을 오갈 때: 편집하는 동안에는 다 자란 모습으로 멈춰 있고, 재생으로 바뀌면 처음부터 돈다
    if (typeof MutationObserver === 'function') {
      this.mo = new MutationObserver(() => this.sync());
      this.mo.observe(document.body, { attributes: true, attributeFilter: ['data-dc-editor-on', 'data-dc-editor-tool'] });
    }
    this.onWinFocus = () => this.grab();
    window.addEventListener('focus', this.onWinFocus);
    if (typeof this.props.onReady === 'function') this.props.onReady({ total: TOTAL, slow: TIME.slow });
    if (this.state.phase === 'play') this.play();
    else if (this.state.phase === 'done') this.tell(this.why());
  }

  componentDidUpdate() {
    if (!this.isCover()) return;
    if (this.props.run !== this.lastRun) {
      // 다시 재생: 동작 줄이기나 한 번만 보기와 상관없이 처음부터 돈다
      this.lastRun = this.props.run;
      this.lastSlow = !!this.props.slow;
      if (!this.editing()) this.play(true);
      return;
    }
    if (!!this.props.slow !== this.lastSlow) {
      // 재생 중에 빠르기를 바꾸면 지금 장면에서 이어 간다
      this.lastSlow = !!this.props.slow;
      this.speed = this.props.slow ? TIME.slow : 1;
    }
  }

  componentWillUnmount() {
    clearTimeout(this.upT);
    clearTimeout(this.heldT);
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.mo) this.mo.disconnect();
    if (this.onWinFocus) window.removeEventListener('focus', this.onWinFocus);
  }

  isCover() { return (this.props.mode || 'cover') === 'cover'; }

  // 캔버스에서 편집하는 중인가
  editing() {
    const b = document.body;
    return !!b && b.hasAttribute('data-dc-editor-on') && b.getAttribute('data-dc-editor-tool') !== 'interact';
  }

  // 운영체제의 "동작 줄이기"
  reduced() {
    if (this.props.reduce) return true;
    return typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  // 처음부터 보여 주지 않는 까닭: 동작 줄이기('reduce'), 이미 본 세션('once'). 보여 줄 때는 ''
  why() { return this.reduced() ? 'reduce' : this.props.once && seen() ? 'once' : ''; }
  blocked() { return this.why() !== ''; }

  sync() {
    if (this.editing()) {
      if (this.state.phase !== 'poster') {
        if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; }
        clearTimeout(this.upT);
        clearTimeout(this.heldT);
        this.held = false;
        this.setState({ f: [LAST, LAST, LAST, LAST], phase: 'poster', step: 0 });
      }
    } else if (this.state.phase === 'poster') {
      if (this.blocked()) { this.setState({ phase: 'done', step: 0 }); this.tell(this.why()); } else this.play();
    }
  }

  // again: 다시 재생으로 시작했는가. 그때는 눌렀던 단추에서 포커스를 가져온다(아무 키로 건너뛰기를 바로 해 볼 수 있게)
  play(again) {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.take = !!again;
    this.speed = this.props.slow ? TIME.slow : 1;
    this.clock = 0;      // 재생을 시작한 뒤 흐른 시간(ms, 느리게 보기에서는 천천히 간다)
    this.last = performance.now();
    this.cut = LIFT_AT;  // 걷히기 시작하는 때. 건너뛰면 그 순간으로 당겨진다
    this.sig = '0000P0';
    this.setState({ f: [0, 0, 0, 0], phase: 'play', step: 0 });
    this.raf = requestAnimationFrame(this.tick);
    this.grab();
    if (typeof this.props.onPlay === 'function') this.props.onPlay();
  }

  // 건너뛰기: 지금 모습 그대로 바로 걷히기 시작한다
  skip() {
    if (this.state.phase !== 'play' || !this.raf) return;
    if (this.clock < this.cut) this.cut = this.clock;
  }

  // 다 걷혔다
  finish() {
    this.sig = '';
    this.take = false;
    if (this.props.once) markSeen();
    if (this.held) {
      // 아직 누르고 있다: 그림은 치우고 받는 층만 남겨, 손을 떼기를 기다린다
      this.setState({ phase: 'held', step: 0 });
      clearTimeout(this.heldT);
      this.heldT = setTimeout(this.letGo, HELD_MAX);
      return;
    }
    this.close();
  }

  // 층을 없앤다
  close() {
    // 가져왔던 포커스를 돌려준다(뒤 화면의 단축키가 바로 듣는다)
    const back = this.prev;
    this.prev = null;
    if (back && back.isConnected && this.coverEl && document.activeElement === this.coverEl) back.focus({ preventScroll: true });
    this.setState({ phase: 'done', step: 0 });
    this.tell('');
  }

  tell(skipped) { if (typeof this.props.onDone === 'function') this.props.onDone({ skipped }); }

  // 덮고 있는 동안 키를 받으려고 포커스를 갖는다. 버튼이나 입력칸이 포커스를 갖고 있거나 다른 문서가 앞에 있으면 가져오지 않는다
  // (다시 재생으로 시작했을 때만 단추에서도 가져온다). 다 걷히면 원래 갖고 있던 곳에 돌려준다
  grab() {
    const el = this.coverEl;
    if (!el || this.editing() || !document.hasFocus()) return;
    const a = document.activeElement;
    if (a === el) return;
    if (!this.take && a && a !== document.body && a.matches && a.matches('a, button, input, textarea, select, [contenteditable]')) return;
    this.take = false;
    this.prev = a && a !== document.body ? a : null;
    el.focus({ preventScroll: true });
  }

  renderVals() {
    const mode = this.props.mode || 'cover';
    const st = this.state;
    const solo = typeof this.props.onDone !== 'function';
    const rootCls = (this.props.theme === 'dark' ? 'dark' : '') + (this.props.device === 'mobile' ? ' mobile' : '');
    if (mode === 'still') {
      return { rootCls, isCover: false, isStill: true, isFrames: false, stills: SPRITES.map((s, i) => ({ no: two(i + 1), name: s.name, cells: s.cells })) };
    }
    if (mode === 'frames') {
      const s = TIME;
      return {
        rootCls, isCover: false, isStill: false, isFrames: true,
        timeLine: '솔씨 ' + s.seedHold + ' · 시차 ' + s.stagger + ' · 솔방울 ' + s.coneFrame + '×' + CONE_FRAMES + ' · 분재 ' + s.growFrame + '×' + GROW_FRAMES + ' · 멈춤 ' + s.endHold + ' · 걷힘 ' + s.lift + ' = ' + TOTAL + 'ms',
        heads: HEADS.map((h, f) => ({ no: 'F' + f, name: h[0] || '\u00A0', ms: h[1] ? h[1] + 'ms' : '\u00A0' })),
        sheet: SPRITES.map((sp, i) => ({ no: two(i + 1), name: sp.name, frames: FRAME_CLASS.map((c, f) => ({ cells: shown(i, f) })) })),
      };
    }
    return {
      rootCls, isCover: true, isStill: false, isFrames: false, solo, again: this.again,
      setCover: this.setCover, onDown: this.onDown, onUp: this.onUp, onClick: this.onClick, onKey: this.onKey,
      covering: st.phase !== 'done',
      veil: st.phase !== 'held',
      clip: st.phase === 'lift' && st.step > 0 ? 'inset(0 0 ' + (st.step * 100 / TIME.liftSteps).toFixed(4) + '% 0)' : 'none',
      labels: !!this.props.slow && st.phase !== 'poster',
      trees: SPRITES.map((s, i) => ({ fc: FRAME_CLASS[st.f[i]], fi: 'F' + st.f[i], small: SMALL_CELLS, plant: s.plant, cells: s.cells })),
    };
  }
}
</script>
</body>
</html>
