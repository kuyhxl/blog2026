<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E3ECE4}
body:has(.bx.dark){background:#162119}
/* 토큰: 라이트. 데스크톱 화면(MainV2)과 같은 값 */
.bx{--bg:#E3ECE4;--panel:#F3F7F2;--sunken:#D3DFD5;--ink:#141A16;--ink-2:#38423B;--ink-3:#525D55;--line:rgba(20,26,22,.2);--line-2:rgba(20,26,22,.4);--dot:rgba(20,26,22,.3);--hover:rgba(20,26,22,.06);--pine-1:#7DAA6B;--pine-2:#4D8553;--pine-3:#2E5B3E;--bark-1:#6B5142;--bark-2:#43322A;--fx:rgb(74,128,92);--ease:cubic-bezier(.22,1,.36,1);--sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* 토큰: 다크 */
.bx.dark{--bg:#162119;--panel:#1F2D23;--sunken:#0E1711;--ink:#E3ECE4;--ink-2:#B7C3BA;--ink-3:#9AA79D;--line:rgba(227,236,228,.17);--line-2:rgba(227,236,228,.34);--dot:rgba(227,236,228,.22);--hover:rgba(227,236,228,.07);--pine-1:#4E7767;--pine-2:#35584B;--pine-3:#243E36;--bark-1:#4F463E;--bark-2:#3B322C;--fx:rgb(149,205,166);color-scheme:dark}
.bx:focus,.bx:focus-visible{outline:none}
.bx *,.bx *::before,.bx *::after{box-sizing:border-box}
/* 누름 효과가 눌렀다는 표시를 대신하므로, 브라우저가 누른 자리에 덮는 회색 표시는 끈다("동작 줄이기"에서는 그대로 둔다) */
@media (prefers-reduced-motion:no-preference){.bx{-webkit-tap-highlight-color:transparent}}
.bx a{color:inherit;text-decoration:none}
.bx button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer}
.bx :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bx .mono{font-family:var(--mono);font-size:12px;line-height:1;letter-spacing:.04em;text-transform:uppercase}

/* 메뉴: 좁은 화면에서는 [키] 표시 없이 이름만. 현재 화면은 이름에 밑줄 */
.bx .nk{color:var(--ink-3)}
.bx .nk.cur{color:var(--ink)}
.bx .nk.cur .l{text-decoration:underline;text-underline-offset:6px}
.bx .nk.hit{color:var(--bg);background:var(--ink)}

/* 호버(마우스를 쓸 때만): 옅은 띠와 글자색만 바뀐다 */
@media (hover:hover){
.bx .nk:hover{color:var(--ink)}
.lk:hover{text-decoration:underline;text-underline-offset:4px}
.ghost:hover{background:var(--hover)}
.solid:hover{background:var(--ink);color:var(--bg)}
.row-h:hover{background:var(--hover)}
}

/* 소나무: 좁은 화면에서는 한 칸 = 2px(128×96px). 헤더 바로 아래 오른쪽 끝, 제목 옆에 선다 */
.bx{isolation:isolate}
.pine{position:absolute;z-index:-1;right:0;top:60px;width:128px;height:96px;pointer-events:none}
.pine .p1{fill:var(--pine-1)}
.pine .p2{fill:var(--pine-2)}
.pine .p3{fill:var(--pine-3)}
.pine .k1{fill:var(--bark-1)}
.pine .k2{fill:var(--bark-2)}
.bx.dark .th{transform:scaleX(-1)}

/* 커서 효과: 데스크톱과 같은 층. 손가락으로는 누름 효과만 나온다(잔상과 커서 네모는 마우스일 때만) */
.bx{position:relative}
.fx{position:absolute;left:0;top:0;width:100%;height:100%;z-index:80;contain:strict;pointer-events:none}
.fx i,.fx-c{position:absolute;left:0;top:0;width:4px;height:4px;border:1px solid var(--fx);opacity:0;pointer-events:none}
.fx-c{position:fixed;z-index:81;width:6px;height:6px;margin:-3px 0 0 -3px;opacity:.8;visibility:hidden}
@media (prefers-reduced-motion:reduce){.fx,.fx-c{display:none}}

/* 필터: 옆으로 미는 줄. 스크롤 막대는 숨긴다 */
.hs{scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}

/* 접어 둔 창(브레인 맵)과 글 행: 누르면 아래로 펼쳐진다. 방금 누른 것(.anim)만 움직인다 */
.row.open .row-h{background:var(--hover)}
.xp{display:grid;grid-template-rows:0fr;visibility:hidden}
.xp-in{min-height:0;overflow:hidden}
.xp-c{opacity:0}
.open>.xp{grid-template-rows:1fr;visibility:visible}
.open>.xp .xp-c{opacity:1}
.anim>.xp{transition:grid-template-rows .6s var(--ease),visibility 0s linear .6s}
.anim.open>.xp{transition:grid-template-rows .6s var(--ease),visibility 0s linear}
.anim>.xp .xp-c{transition:opacity .18s linear}
.anim.open>.xp .xp-c{transition:opacity .4s linear .08s}
.pm .v{transform-origin:7px 7px}
.open>.row-h .pm .v,.open>.pm .v{transform:rotate(90deg)}
.anim>.row-h .pm .v,.anim>.pm .v{transition:transform .5s var(--ease)}
/* 필터나 정렬이 바뀌면 목록이 한 번 옅게 다시 나타난다 */
@keyframes la{from{opacity:.3}to{opacity:1}}
@keyframes lb{from{opacity:.3}to{opacity:1}}
.rows.a{animation:la .24s ease-out}
.rows.b{animation:lb .24s ease-out}

/* 브레인 맵: 점과 선의 자리는 스크립트가 매 프레임 옮기고, 강조는 클래스로 바꾼다. 점은 손가락으로 누르기 좋게 둘레 24px까지 받는다 */
.gl{stroke:var(--ink);stroke-width:1;stroke-opacity:.32;transition:stroke-opacity .2s linear}
.gl.faint{stroke-opacity:.1}
.gl.hot{stroke-opacity:1;stroke-width:1.25}
.gn{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent;transition:opacity .2s linear}
.gn .sq{width:7px;height:7px;background:var(--ink);outline:1px solid transparent;outline-offset:2px;transition:width .18s ease-out,height .18s ease-out}
.gn.near .sq{width:9px;height:9px}
.gn.hot .sq{width:11px;height:11px;outline-color:var(--ink)}
.gn.far{opacity:.3}
.gn.dim{opacity:.16}
.gn.dim.hot{opacity:1}
.fig.grab,.fig.grab .gn{cursor:grabbing}

@media (prefers-reduced-motion:reduce){
.anim>.xp,.anim>.xp .xp-c,.anim .pm .v,.gl,.gn,.gn .sq{transition:none!important}
.rows.a,.rows.b{animation:none}
}
</style>

            </div>
          </div>

// ── 브레인 맵의 움직임: 데스크톱과 같은 규칙 ─────────────────────────────────
// 계산은 데스크톱의 작은 창 크기(270×200) 좌표에서 하고, 그릴 때 이 화면의 창 크기에 맞춘다.
const SW = 270, SH = 200, PAD = 12;
const K_HOME = 0.012;  // 제자리로 돌아가려는 힘
const K_LINK = 0.009;  // 연결된 점끼리 원래 거리를 지키려는 힘 (끌면 이웃이 따라온다)
const K_PUSH = 0.25;   // 겹치지 않게 서로 밀어내는 힘
const DAMP = 0.76;     // 프레임마다 남는 속도
const AMP = 4;         // 가만히 있을 때 떠다니는 폭(px)
const HERE = 'b';      // 이 화면의 단축키(키보드를 연결했을 때)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// 글자를 입력하는 자리에서는 단축키를 받지 않는다
const typing = (t) => !!t && (t.isContentEditable || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset)$/.test(t.type)));

// ── 커서 효과 (모든 화면 공통) ─────────────────────────────────────────────
// 덧그리는 층(.fx)에 미리 놓아 둔 테두리 네모를 돌려 쓴다. 자리와 크기 변화만 스크립트가 정한다
const FX_CELL = 14; // 잔상이 찍히는 간격이자 자리를 맞추는 격자(px)
// 잔상(마우스일 때만): 20px로 찍힌 뒤 4px까지 일정한 속도로 작아지며 0.8초 동안 사라진다
const FX_TRAIL = { from: 20, to: 4, ms: 800, alpha: 0.55, ease: 'linear' };
// 누름(손가락, 펜, 마우스): 4px에서 24px까지 퍼지며 0.65초 동안 사라진다
const FX_PRESS = { from: 4, to: 24, ms: 650, alpha: 0.8, ease: 'cubic-bezier(.215,.61,.355,1)' };
const FX_TRAILS = 120, FX_PRESSES = 6; // 한꺼번에 떠 있을 수 있는 네모 수(잔상, 누름)

class Component extends DCLogic {
  constructor(props) {
    super(props);
    // order: 펼친 행을 펼친 순서대로. 맨 뒤가 그래프에서 표시되는 글이다
    // theme, fig: 버튼으로 고른 값. null이면 이 화면에 주어진 값(theme, map)을 따른다. figAnim: 방금 창을 접거나 펼쳤는지
    this.state = { sort: 'date', dir: 'desc', open: { paging: true }, order: ['paging'], anim: null, rev: 0, hover: null, via: null, drag: false, key: null, types: {}, topics: {}, theme: null, fig: null, figAnim: false, searchOpen: false };
    this.toggleTheme = () => this.setState((st) => ({ theme: this.isDark(st) ? 'light' : 'dark' }));
    this.toggleFig = () => this.setState((st) => ({ fig: !this.figOpen(st), figAnim: true, hover: null }));
    // 검색 창: 열 때는 검색 창이 입력칸으로 포커스를 가져가고, 닫으면 검색 버튼으로 돌려준다
    this.setSearchBtn = (el) => { this.searchBtn = el; };
    this.openSearch = () => this.setState({ searchOpen: true });
    this.closeSearch = () => {
      this.setState({ searchOpen: false });
      setTimeout(() => { if (this.searchBtn) this.searchBtn.focus({ preventScroll: true }); }, 0);
    };
    // 방향을 뺀 연결과 이웃 목록
    const seen = {};
    this.pairs = [];
    this.adj = {};
    LINKS.forEach(([a, b]) => {
      const k = a < b ? a + '|' + b : b + '|' + a;
      if (seen[k]) return;
      seen[k] = true;
      this.pairs.push([a, b]);
      (this.adj[a] = this.adj[a] || {})[b] = true;
      (this.adj[b] = this.adj[b] || {})[a] = true;
    });
    this.byId = {};
    POSTS.forEach((p) => { this.byId[p.id] = p; });

    // 점: 창에 여백 없이 차도록 맞춘 자리가 제자리(hx, hy)다
    const xs = POSTS.map((p) => p.x), ys = POSTS.map((p) => p.y);
    const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    this.simOf = {};
    this.sim = POSTS.map((p, i) => {
      const x = (0.07 + ((p.x - x0) / (x1 - x0)) * 0.86) * SW, y = (0.09 + ((p.y - y0) / (y1 - y0)) * 0.82) * SH;
      const n = { id: p.id, x, y, vx: 0, vy: 0, ax: 0, ay: 0, hx: x, hy: y, p1: i * 2.399963, p2: i * 1.731 + 0.6, w1: 0.00052 + (i % 5) * 0.00007, w2: 0.00041 + (i % 7) * 0.00005 };
      this.simOf[p.id] = n;
      return n;
    });
    this.links = this.pairs.map(([a, b]) => {
      const A = this.simOf[a], B = this.simOf[b];
      return { a: A, b: B, len: Math.hypot(B.hx - A.hx, B.hy - A.hy) };
    });
    // 서로 밀어내기 시작하는 거리: 처음 배치에서는 아무도 밀리지 않게 잡는다
    this.reach = 14;
    for (let i = 0; i < this.sim.length; i++) for (let j = i + 1; j < this.sim.length; j++) {
      this.reach = Math.min(this.reach, Math.hypot(this.sim[i].hx - this.sim[j].hx, this.sim[i].hy - this.sim[j].hy) * 0.92);
    }
    this.amp = 0;
    this.held = null;
    this.fig = null;

    this.setRoot = (el) => { this.rootEl = el; };
    this.setFig = (el) => { this.fig = el ? { el } : null; };

    // 커서 효과: 덧그리는 층, 커서 아래 네모, 층에 놓아 둘 네모 수만큼의 목록
    this.fxPool = Array.from({ length: FX_TRAILS + FX_PRESSES }, (_, i) => i);
    this.fxAnim = [];
    this.setFx = (el) => { this.fxEl = el; };
    this.setFxDot = (el) => { this.fxDot = el; };
    this.fxMove = (e) => this.fxTrail(e);
    this.fxDown = (e) => this.fxTap(e);
    this.fxLeave = () => this.fxHide();

    // 점과 행의 손잡이
    this.enters = {};
    this.downs = {};
    this.clicks = {};
    this.toggles = {};
    POSTS.forEach((p) => {
      // 마우스를 올렸을 때. 손가락으로 누른 뒤에 따라오는 마우스 이벤트는 받지 않는다
      this.enters[p.id] = () => { if (!this.touch && !this.held && (this.state.hover !== p.id || this.state.via !== 'node')) this.setState({ hover: p.id, via: 'node' }); };
      this.downs[p.id] = (e) => this.grab(p.id, e);
      // 끌다가 놓은 직후에는 이동하지 않는다. 손가락으로는 한 번 누르면 그 점을 고르고(아래에 제목이 뜬다), 고른 점을 다시 누르면 글로 간다
      this.clicks[p.id] = (e) => {
        if (this.dropped) { e.preventDefault(); return; }
        if (this.touch && !this.wasPicked) { e.preventDefault(); this.setState({ hover: p.id, via: 'node' }); }
      };
      this.toggles[p.id] = () => this.setState((st) => {
        const next = Object.assign({}, st.open);
        next[p.id] = !next[p.id];
        const order = st.order.filter((id) => id !== p.id);
        if (next[p.id]) order.push(p.id);
        return { open: next, order, anim: p.id, figAnim: false };
      });
    });
    this.leave = () => { if (!this.held && !this.touch && this.state.hover) this.setState({ hover: null }); };
    // 빈 곳을 누르면 고른 점을 푼다
    this.figClick = (e) => { if (!(e.target.closest && e.target.closest('.gn')) && this.state.hover) this.setState({ hover: null }); };

    this.figMove = (e) => {
      if (e.pointerType === 'mouse') this.touch = false;
      const h = this.held;
      if (!h || e.pointerId !== h.pid) return;
      if (!h.moved) {
        if (Math.abs(e.clientX - h.sx) + Math.abs(e.clientY - h.sy) < 6) return;
        h.moved = true;
        this.setState({ drag: true, hover: h.n.id, via: 'node' });
      }
      const r = this.fig.el.getBoundingClientRect(), m = this.fig.m;
      h.n.x = clamp((e.clientX - r.left) / m.kx + h.dx, PAD, SW - PAD);
      h.n.y = clamp((e.clientY - r.top) / m.ky + h.dy, PAD, SH - PAD);
    };
    this.figUp = (e) => {
      const h = this.held;
      if (!h || (e && e.pointerId !== h.pid)) return;
      this.held = null;
      if (!h.moved) return;
      // 놓은 자리가 새 제자리가 된다. 이 점에 걸린 선의 길이도 거기에 맞춘다
      h.n.hx = h.n.x;
      h.n.hy = h.n.y;
      this.links.forEach((l) => { if (l.a === h.n || l.b === h.n) l.len = Math.hypot(l.b.hx - l.a.hx, l.b.hy - l.a.hy); });
      this.dropped = true;
      setTimeout(() => { this.dropped = false; }, 0);
      this.setState({ drag: false });
    };

    this.onKey = (e) => {
      if (e.defaultPrevented || this.editing()) return;
      // 검색: ⌘K 또는 Ctrl+K(키보드를 연결했을 때)
      if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && (e.key === 'k' || e.key === 'K' || e.code === 'KeyK')) {
        e.preventDefault();
        if (this.state.searchOpen) this.closeSearch(); else this.openSearch();
        return;
      }
      if (this.state.searchOpen) {
        if (e.key === 'Escape') { e.preventDefault(); this.closeSearch(); }
        return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || e.repeat || typing(e.target)) return;
      // 한글 입력 상태에서도 같은 자리의 키로 동작하게 한다
      const ch = e.key && e.key.length === 1 ? e.key.toLowerCase() : '';
      const k = /^[a-z]$/.test(ch) ? ch : e.code === 'KeyB' ? 'b' : e.code === 'KeyC' ? 'c' : '';
      if (k !== 'b' && k !== 'c') return;
      e.preventDefault();
      this.go(k);
    };

    this.tick = (now) => {
      this.raf = requestAnimationFrame(this.tick);
      // 창을 접어 둔 동안에는 계산하지 않는다. 천천히 떠다니기만 하는 동안에는 두 프레임에 한 번만 계산한다
      if (!this.figOpen(this.state)) { this.last = 0; return; }
      this.odd = !this.odd;
      if (this.odd && !this.held && !(this.speed > 0.2)) return;
      const dt = clamp((now - (this.last || now)) / 16.667, 0.25, 3);
      this.last = now;
      this.place(this.step(now, dt));
    };
  }

  componentDidMount() {
    this.reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    this.place(true);
    this.raf = requestAnimationFrame(this.tick);
    // 단축키를 바로 받을 수 있게, 이 문서에 포커스가 와 있는데 받는 요소가 없으면 화면 전체가 받는다.
    // 다른 문서의 포커스를 가져오지는 않는다
    this.onFocus = () => { if (this.rootEl && !this.editing() && document.activeElement === document.body) this.rootEl.focus({ preventScroll: true }); };
    window.addEventListener('focus', this.onFocus);
    if (document.hasFocus()) this.onFocus();
    // 커서 효과: 화면 어디에서 움직이고 누르든 받는다. 받기만 하고 기본 동작은 건드리지 않는다
    window.addEventListener('pointermove', this.fxMove, { capture: true, passive: true });
    window.addEventListener('pointerdown', this.fxDown, { capture: true, passive: true });
    document.documentElement.addEventListener('pointerleave', this.fxLeave);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    clearTimeout(this.navT);
    window.removeEventListener('focus', this.onFocus);
    window.removeEventListener('pointermove', this.fxMove, { capture: true });
    window.removeEventListener('pointerdown', this.fxDown, { capture: true });
    document.documentElement.removeEventListener('pointerleave', this.fxLeave);
  }

  // ── 커서 효과 ──
  // 그려도 되는가: 캔버스에서 편집하는 중이거나 "동작 줄이기"가 켜져 있으면 그리지 않는다
  fxOn() {
    return !!this.fxEl && !this.editing() && !(this.reduce && this.reduce.matches);
  }

  // 커서 아래 네모를 치우고, 잔상을 이어 가던 자리도 잊는다
  fxHide() {
    this.fxAt = null;
    if (this.fxDot) this.fxDot.style.visibility = 'hidden';
  }

  // 층의 왼쪽 위가 문서의 어디인지. 네모는 문서에 찍히므로 스크롤하면 글과 함께 움직인다
  fxOrigin(e) {
    const r = this.fxEl.getBoundingClientRect();
    this.fxOx = r.left + (e.pageX - e.clientX);
    this.fxOy = r.top + (e.pageY - e.clientY);
  }

  // i번째 네모를 (x, y)에 중심을 두고 from → to 크기로 바꾸면서 지운다. 테두리 굵기는 1px 그대로다
  fxStamp(i, x, y, k) {
    const el = this.fxEl.children[i];
    if (!el || !el.animate) return;
    const old = this.fxAnim[i];
    if (old) { old[0].cancel(); old[1].cancel(); }
    const a = k.from / 2, b = k.to / 2;
    this.fxAnim[i] = [
      el.animate([
        { left: x - a + 'px', top: y - a + 'px', width: k.from + 'px', height: k.from + 'px' },
        { left: x - b + 'px', top: y - b + 'px', width: k.to + 'px', height: k.to + 'px' },
      ], { duration: k.ms, easing: k.ease }),
      el.animate([{ opacity: k.alpha }, { opacity: 0 }], { duration: k.ms }),
    ];
  }

  // 가장 가까운 격자점에 잔상 하나. 바로 앞에 찍은 자리와 같으면 건너뛴다
  fxPut(x, y) {
    const gx = Math.round(x / FX_CELL) * FX_CELL, gy = Math.round(y / FX_CELL) * FX_CELL;
    if (gx === this.fxGx && gy === this.fxGy) return;
    this.fxGx = gx;
    this.fxGy = gy;
    this.fxN = ((this.fxN || 0) + 1) % FX_TRAILS;
    this.fxStamp(this.fxN, gx, gy, FX_TRAIL);
  }

  // 마우스가 움직일 때만 잔상을 찍는다. 터치와 펜은 스크롤과 겹치므로 잔상을 남기지 않는다
  fxTrail(e) {
    if (e.pointerType !== 'mouse' || !this.fxOn()) { this.fxHide(); return; }
    const x = e.clientX, y = e.clientY, d = this.fxDot;
    if (d) { d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.visibility = 'visible'; }
    const last = this.fxAt; // 마지막으로 잔상을 찍은 자리(화면 좌표, 격자에 맞추기 전)
    if (!last) { this.fxOrigin(e); this.fxAt = { x, y }; return; }
    const dx = x - last.x, dy = y - last.y, dist = Math.hypot(dx, dy);
    if (dist < FX_CELL) return;
    // 화면 좌표를 층 안의 좌표로 옮길 때 더하는 값(지금의 스크롤 − 층의 자리)
    const sx = e.pageX - x - this.fxOx, sy = e.pageY - y - this.fxOy;
    // 한 번에 아주 멀리 건너뛰었으면 사이를 잇지 않고 그 자리에만 찍는다
    if (dist > FX_CELL * 40) { this.fxAt = { x, y }; this.fxPut(x + sx, y + sy); return; }
    const n = Math.floor(dist / FX_CELL), ux = (dx / dist) * FX_CELL, uy = (dy / dist) * FX_CELL;
    for (let i = 1; i <= n; i++) this.fxPut(last.x + ux * i + sx, last.y + uy * i + sy);
    this.fxAt = { x: last.x + ux * n, y: last.y + uy * n };
  }

  // 누를 때(손가락, 펜, 마우스 왼쪽 버튼): 격자에 맞추지 않고 누른 자리 그대로에서 네모 하나가 퍼진다
  fxTap(e) {
    if (!this.fxOn() || !e.isPrimary || e.button > 0) return;
    if (e.pointerType !== 'mouse') this.fxHide();
    this.fxOrigin(e);
    this.fxK = ((this.fxK || 0) + 1) % FX_PRESSES;
    this.fxStamp(FX_TRAILS + this.fxK, Math.round(e.pageX - this.fxOx), Math.round(e.pageY - this.fxOy), FX_PRESS);
  }

  isDark(st) {
    return st.theme ? st.theme === 'dark' : this.props.theme === 'dark';
  }

  // 브레인 맵 창이 펼쳐져 있는가
  figOpen(st) {
    return st.fig === null ? this.props.map === 'open' : st.fig;
  }

  // 캔버스에서 편집하는 동안에는 단축키와 움직임을 멈춘다
  editing() {
    const b = document.body;
    return b.hasAttribute('data-dc-editor-on') && b.getAttribute('data-dc-editor-tool') !== 'interact';
  }

  // 단축키: 메뉴를 한 번 반전시킨 뒤 그 링크를 누른 것과 똑같이 이동한다
  go(k) {
    if (this.navT) return;
    this.setState({ key: k });
    this.navT = setTimeout(() => {
      this.navT = null;
      this.setState({ key: null });
      if (k === HERE) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      const a = this.rootEl && this.rootEl.querySelector('a[data-key="' + k + '"]');
      if (a) a.click();
    }, 140);
  }

  grab(id, e) {
    // 마우스로 눌렀는지 손가락으로 눌렀는지, 누르기 전에 이미 고른 점이었는지 기억해 둔다(손가락은 한 번 눌러 고르고, 다시 눌러 이동한다)
    this.touch = e.pointerType !== 'mouse';
    this.wasPicked = this.state.hover === id && this.state.via === 'node';
    if (e.button || !this.fig || !this.fig.m) return;
    const el = e.currentTarget, n = this.simOf[id], r = this.fig.el.getBoundingClientRect(), m = this.fig.m;
    // 잡은 자리와 점 중심의 차이를 기억해 두어, 잡는 순간 점이 튀지 않게 한다
    this.held = { n, pid: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false, dx: n.x - (e.clientX - r.left) / m.kx, dy: n.y - (e.clientY - r.top) / m.ky };
    if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  // 한 프레임만큼 힘을 계산해 점을 옮긴다. 움직인 점이 있으면 true
  step(now, dt) {
    const N = this.sim, held = this.held ? this.held.n : null;
    const calm = (this.reduce && this.reduce.matches) || this.editing();
    this.amp += ((calm ? 0 : AMP) - this.amp) * Math.min(1, 0.03 * dt);
    const amp = this.amp;
    for (let i = 0; i < N.length; i++) {
      const n = N[i];
      const tx = n.hx + amp * (Math.sin(now * n.w1 + n.p1) + 0.45 * Math.sin(now * n.w2 * 1.9 + n.p2));
      const ty = n.hy + amp * (Math.cos(now * n.w2 + n.p2) + 0.45 * Math.sin(now * n.w1 * 1.7 + n.p1 * 1.3));
      n.ax = (tx - n.x) * K_HOME;
      n.ay = (ty - n.y) * K_HOME;
    }
    for (let i = 0; i < this.links.length; i++) {
      const l = this.links[i], dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.hypot(dx, dy) || 0.001, f = (K_LINK * (d - l.len)) / d;
      l.a.ax += dx * f; l.a.ay += dy * f;
      l.b.ax -= dx * f; l.b.ay -= dy * f;
    }
    const R = this.reach;
    for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
      const a = N[i], b = N[j], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 >= R * R) continue;
      const d = Math.sqrt(d2) || 0.001, f = (K_PUSH * (1 - d / R)) / d;
      a.ax -= dx * f; a.ay -= dy * f;
      b.ax += dx * f; b.ay += dy * f;
    }
    const keep = Math.pow(DAMP, dt);
    let far = 0;
    for (let i = 0; i < N.length; i++) {
      const n = N[i];
      if (n === held) { n.vx = 0; n.vy = 0; continue; }
      n.vx = (n.vx + n.ax * dt) * keep;
      n.vy = (n.vy + n.ay * dt) * keep;
      const x = clamp(n.x + n.vx * dt, PAD, SW - PAD), y = clamp(n.y + n.vy * dt, PAD, SH - PAD);
      far = Math.max(far, Math.abs(x - n.x) + Math.abs(y - n.y));
      n.x = x;
      n.y = y;
    }
    this.speed = far / dt; // 가장 빨리 움직인 점의 프레임당 이동 거리
    return !!held || far > 0.003;
  }

  // 계산한 자리를 창 안의 점과 선에 옮겨 적는다
  place(moved) {
    const f = this.fig;
    if (!f) return;
    const fresh = !f.nodes || !f.nodes.length || !f.nodes[0].isConnected;
    const w = f.el.clientWidth, h = f.el.clientHeight;
    if (!w || !h || (!moved && !fresh && w === f.w && h === f.h)) return;
    if (fresh) { f.nodes = f.el.querySelectorAll('.gn'); f.lines = f.el.querySelectorAll('.gl'); }
    f.w = w;
    f.h = h;
    const kx = w / SW, ky = h / SH;
    f.m = { kx, ky };
    for (let i = 0; i < this.sim.length; i++) {
      const n = this.sim[i], el = f.nodes[i];
      if (el) el.style.transform = 'translate(' + (n.x * kx).toFixed(2) + 'px,' + (n.y * ky).toFixed(2) + 'px)';
    }
    for (let i = 0; i < this.links.length; i++) {
      const l = this.links[i], el = f.lines[i];
      if (!el) continue;
      el.setAttribute('x1', (l.a.x * kx).toFixed(2));
      el.setAttribute('y1', (l.a.y * ky).toFixed(2));
      el.setAttribute('x2', (l.b.x * kx).toFixed(2));
      el.setAttribute('y2', (l.b.y * ky).toFixed(2));
    }
  }

  renderVals() {
    const s = this.state;
    const typeOn = Object.keys(s.types).filter((k) => s.types[k]);
    const topicOn = Object.keys(s.topics).filter((k) => s.topics[k]);
    const hasFilter = typeOn.length + topicOn.length > 0;
    const match = (p) => (!typeOn.length || !!s.types[p.kind]) && (!topicOn.length || p.topics.some((t) => s.topics[t]));
    const ok = {};
    POSTS.forEach((p) => { ok[p.id] = match(p); });
    const visible = POSTS.filter((p) => ok[p.id]);
    const sorted = visible.slice().sort((a, b) => {
      const c = s.sort === 'date' ? a.date.localeCompare(b.date) : a.title.localeCompare(b.title, 'ko');
      return s.dir === 'asc' ? c : -c;
    });
    let openId = null;
    for (let i = s.order.length - 1; i >= 0 && !openId; i--) if (ok[s.order[i]]) openId = s.order[i];
    const active = s.hover || openId;
    const act = active ? this.byId[active] : null;
    const near = active ? this.adj[active] || {} : {};

    const rows = sorted.map((p) => {
      const open = !!s.open[p.id];
      return {
        date: p.date, title: p.title, summary: p.summary, open,
        tags: [KIND[p.kind]].concat(p.topics),
        cls: (open ? 'open' : '') + (s.anim === p.id ? ' anim' : ''),
        panel: 'xp-' + p.id,
        toggleLabel: (open ? '접기: ' : '펼치기: ') + p.title,
        toggle: this.toggles[p.id],
      };
    });

    // 필터와 정렬은 목록을 통째로 바꾼다: 행 펼침 애니메이션은 끄고 목록을 한 번 다시 드러낸다
    const relist = (patch) => (st) => Object.assign({ anim: null, figAnim: false, rev: st.rev + 1 }, patch(st));
    // 필터 하나: 고르면 검은 바탕으로 뒤집힌다
    const item = (name, key, bag, n) => {
      const on = !!s[bag][key];
      return {
        name, count: n, on,
        fg: on ? 'var(--bg)' : 'var(--ink-2)', bg: on ? 'var(--ink)' : 'transparent', bd: on ? 'var(--ink)' : 'var(--line-2)', cfg: on ? 'var(--bg)' : 'var(--ink-3)',
        toggle: () => this.setState(relist((st) => {
          const next = Object.assign({}, st[bag]);
          next[key] = !next[key];
          return bag === 'types' ? { types: next } : { topics: next };
        })),
      };
    };
    const groups = [
      { label: 'Type', items: Object.keys(KIND).map((k) => item(KIND[k], k, 'types', POSTS.filter((p) => p.kind === k).length)) },
      { label: 'Topic', items: TOPICS.map((t) => item(t, t, 'topics', POSTS.filter((p) => p.topics.indexOf(t) >= 0).length)) },
    ];

    // 그래프: 보고 있는 점(hot)과 그 이웃(near). 점을 직접 고르거나 마우스를 올렸을 때만 그 밖의 점과 선을 흐리게 한다(far, faint).
    // 필터에 걸리지 않은 글은 dim
    const fade = !!s.hover && s.via === 'node';
    const nodes = POSTS.map((p) => {
      const st = p.id === active ? 'hot' : near[p.id] ? 'near' : fade ? 'far' : '';
      return { title: p.title, cls: st + (ok[p.id] ? '' : ' dim'), down: this.downs[p.id], enter: this.enters[p.id], click: this.clicks[p.id] };
    });
    const edges = this.pairs.map(([a, b]) => ({ cls: active && (a === active || b === active) ? 'hot' : fade || !(ok[a] && ok[b]) ? 'faint' : '' }));

    // 테마: 링크와 단축키는 지금 보고 있는 테마의 화면으로 이어진다
    const dark = this.isDark(s);
    const file = (k) => FILES[k] + (dark ? 'Dark' : '') + '.dc.html';
    const figOpen = this.figOpen(s);

    const N = POSTS.length;
    return {
      dark, themeCls: dark ? 'dark' : '', toggleTheme: this.toggleTheme,
      to: { home: file('home'), main: file('main'), post: file('post'), map: file('map') },
      searchOpen: s.searchOpen, openSearch: this.openSearch, closeSearch: this.closeSearch, setSearchBtn: this.setSearchBtn,
      rows, groups, nodes, edges, hasFilter,
      count: visible.length,
      noRows: rows.length === 0,
      rowsCls: s.rev ? (s.rev % 2 ? 'a' : 'b') : '',
      shownLabel: hasFilter ? visible.length + ' / ' + N : '',
      dateColor: s.sort === 'date' ? 'var(--ink)' : 'var(--ink-3)',
      nameColor: s.sort === 'name' ? 'var(--ink)' : 'var(--ink-3)',
      dateArrow: s.sort === 'date' ? (s.dir === 'desc' ? '↓' : '↑') : '',
      nameArrow: s.sort === 'name' ? (s.dir === 'desc' ? '↓' : '↑') : '',
      sortDate: () => this.setState(relist((st) => (st.sort === 'date' ? { dir: st.dir === 'desc' ? 'asc' : 'desc' } : { sort: 'date', dir: 'desc' }))),
      sortName: () => this.setState(relist((st) => (st.sort === 'name' ? { dir: st.dir === 'desc' ? 'asc' : 'desc' } : { sort: 'name', dir: 'asc' }))),
      clearFilters: () => this.setState(relist(() => ({ types: {}, topics: {} }))),
      leave: this.leave,
      hasActive: !!act, noActive: !act,
      activeDate: act ? act.date : '', activeTitle: act ? act.title : '',
      graphStat: (hasFilter ? visible.length + ' / ' + N : N) + ' nodes · ' + this.pairs.length + ' links',
      figOpen, figFold: (figOpen ? 'open' : '') + (s.figAnim ? ' anim' : ''),
      figLabel: figOpen ? '글 연결 그래프 접기' : '글 연결 그래프 펼치기',
      toggleFig: this.toggleFig,
      figCls: s.drag ? 'grab' : '',
      figMove: this.figMove, figUp: this.figUp, figClick: this.figClick,
      setRoot: this.setRoot, setFig: this.setFig,
      fxPool: this.fxPool, setFx: this.setFx, setFxDot: this.setFxDot,
      onKey: this.onKey,
      hitB: s.key === 'b' ? 'hit' : '',
      hitC: s.key === 'c' ? 'hit' : '',
    };
  }
}
</script>
</body>
</html>
