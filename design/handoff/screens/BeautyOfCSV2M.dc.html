<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E3ECE4}
body:has(.bx.dark){background:#162119}
/* 토큰: 라이트. 데스크톱 화면(BeautyOfCSV2)과 같은 값 */
.bx{--bg:#E3ECE4;--panel:#F3F7F2;--sunken:#D3DFD5;--ink:#141A16;--ink-2:#38423B;--ink-3:#525D55;--line:rgba(20,26,22,.2);--line-2:rgba(20,26,22,.4);--dot:rgba(20,26,22,.3);--hover:rgba(20,26,22,.06);--pine-1:#7DAA6B;--pine-2:#4D8553;--pine-3:#2E5B3E;--bark-1:#6B5142;--bark-2:#43322A;--fx:rgb(74,128,92);--ease:cubic-bezier(.22,1,.36,1);--sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* 토큰: 다크 */
.bx.dark{--bg:#162119;--panel:#1F2D23;--sunken:#0E1711;--ink:#E3ECE4;--ink-2:#B7C3BA;--ink-3:#9AA79D;--line:rgba(227,236,228,.17);--line-2:rgba(227,236,228,.34);--dot:rgba(227,236,228,.22);--hover:rgba(227,236,228,.07);--pine-1:#4E7767;--pine-2:#35584B;--pine-3:#243E36;--bark-1:#4F463E;--bark-2:#3B322C;--fx:rgb(149,205,166);color-scheme:dark}
.bx:focus,.bx:focus-visible{outline:none}
.bx *,.bx *::before,.bx *::after{box-sizing:border-box}
/* 누름 효과가 눌렀다는 표시를 대신하므로, 브라우저가 누른 자리에 덮는 회색 표시는 끈다("동작 줄이기"에서는 그대로 둔다) */
@media (prefers-reduced-motion:no-preference){.bx{-webkit-tap-highlight-color:transparent}}
.bx a{color:inherit;text-decoration:none}
.bx button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer}
.bx :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bx .mono{font-family:var(--mono);font-size:12px;line-height:1;letter-spacing:.04em;text-transform:uppercase}
/* 화면 전체를 쓰는 화면: 주소창이 접히고 펴져도 높이가 맞게 한다 */
.full{height:100vh;height:100dvh}

/* 메뉴: 좁은 화면에서는 [키] 표시 없이 이름만. 현재 화면은 이름에 밑줄 */
.bx .nk{color:var(--ink-3)}
.bx .nk.cur{color:var(--ink)}
.bx .nk.cur .l{text-decoration:underline;text-underline-offset:6px}
.bx .nk.hit{color:var(--bg);background:var(--ink)}

/* 호버(마우스를 쓸 때만): 옅은 띠와 글자색만 바뀐다 */
@media (hover:hover){
.bx .nk:hover{color:var(--ink)}
.ghost:hover{background:var(--hover)}
.solid:hover{background:var(--ink-2)!important}
.row-h:hover{background:var(--hover)}
.nd:not(.sel):hover{background:var(--sunken)!important}
}
.nd{-webkit-tap-highlight-color:transparent}

/* 소나무: 제목 줄 오른쪽 끝에 한 칸 = 2px로 두고, 줄 아래로 내려가는 부분은 가린다(지도 뒤에 서 있는 나무처럼 윗부분만 보인다) */
.pine{position:absolute;right:0;top:3px;width:128px;height:96px;pointer-events:none}
.pine .p1{fill:var(--pine-1)}
.pine .p2{fill:var(--pine-2)}
.pine .p3{fill:var(--pine-3)}
.pine .k1{fill:var(--bark-1)}
.pine .k2{fill:var(--bark-2)}
.bx.dark .th{transform:scaleX(-1)}

/* 커서 효과: 데스크톱과 같은 층. 손가락으로는 누름 효과만 나온다(잔상과 커서 네모는 마우스일 때만) */
.bx{position:relative}
.fx{position:absolute;left:0;top:0;width:100%;height:100%;z-index:80;contain:strict;pointer-events:none}
.fx i,.fx-c{position:absolute;left:0;top:0;width:4px;height:4px;border:1px solid var(--fx);opacity:0;pointer-events:none}
.fx-c{position:fixed;z-index:81;width:6px;height:6px;margin:-3px 0 0 -3px;opacity:.8;visibility:hidden}
@media (prefers-reduced-motion:reduce){.fx,.fx-c{display:none}}

/* 요약 패널: 화면 아래에서 올라온다. 손잡이 줄을 끌어 높이를 바꾸는 동안(.drag)에는 따라오기만 하고, 놓으면 반 또는 전체 높이로 맞춰진다 */
.sheet{transition:height .32s var(--ease)}
.sheet.drag{transition:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet.anim{animation:up .32s var(--ease) both}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.sheet.anim{animation:none}}
</style>

// 두 줄로 쓸 때 줄을 바꾸는 자리: 괄호 앞, 괄호가 없으면 가운뎃점 뒤(둘 다 없으면 띄어쓰기에서 알아서 나뉜다)
const soft = (t) => (t.indexOf("(") >= 0 ? t.replace("(", "\n(") : t.replace("·", "·\n"));
// cs-data:end

// ── 좁은 화면의 치수 ───────────────────────────────────────────────────────
const CHROME = 112;        // 헤더 + 제목 줄 높이. 그 아래가 모두 지도다
const LEGEND = 44;         // 지도 맨 아래 범례 줄 높이
const HOME_K = 1;          // 처음 배율: 글자를 읽을 수 있는 크기로 시작한다
const MIN_K = 0.25, MAX_K = 2.4;
const SHEET_HALF = 0.46;   // 요약 패널의 기본 높이(화면 높이에 대한 비율)
const SHEET_GAP = -1;      // 패널을 끝까지 올렸을 때: 제목 줄 바로 아래까지 덮는다(두 줄의 테두리가 겹치도록 1px 올린다)
const SHEET_MIN = 132;     // 이보다 낮게 끌어 내리면 닫힌다
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const HERE = "c"; // 이 화면의 단축키(키보드를 연결했을 때)
// 글자를 입력하는 자리에서는 단축키를 받지 않는다
const typing = (t) => !!t && (t.isContentEditable || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || (t.tagName === "INPUT" && !/^(checkbox|radio|button|submit|reset)$/.test(t.type)));

// ── 커서 효과 (모든 화면 공통) ─────────────────────────────────────────────
// 덧그리는 층(.fx)에 미리 놓아 둔 테두리 네모를 돌려 쓴다. 자리와 크기 변화만 스크립트가 정한다
const FX_CELL = 14; // 잔상이 찍히는 간격이자 자리를 맞추는 격자(px)
// 잔상(마우스일 때만): 20px로 찍힌 뒤 4px까지 일정한 속도로 작아지며 0.8초 동안 사라진다
const FX_TRAIL = { from: 20, to: 4, ms: 800, alpha: 0.55, ease: "linear" };
// 누름(손가락, 펜, 마우스): 4px에서 24px까지 퍼지며 0.65초 동안 사라진다
const FX_PRESS = { from: 4, to: 24, ms: 650, alpha: 0.8, ease: "cubic-bezier(.215,.61,.355,1)" };
const FX_TRAILS = 120, FX_PRESSES = 6; // 한꺼번에 떠 있을 수 있는 네모 수(잔상, 누름)

class Component extends DCLogic {
  constructor(props) {
    super(props);
    // view: 손으로 옮기거나 확대한 뒤의 보기. null이면 고른 개념이 보이는 자리에서 시작한다
    // sheet: 요약 패널의 높이 단계("half" | "full"). sheetH: 손잡이를 끄는 동안의 높이(px)
    // theme: 테마 버튼으로 고른 값. null이면 이 화면에 주어진 theme 값을 따른다
    this.state = { expanded: { "os-memory": true }, selected: "os-paging", hover: null, view: null, rw: 0, rh: 0, key: null, theme: null, sheet: "half", sheetH: null, searchOpen: false };
    this.toggleTheme = () => this.setState((st) => ({ theme: this.isDark(st) ? "light" : "dark" }));
    // 검색 창: 열 때는 검색 창이 입력칸으로 포커스를 가져가고, 닫으면 검색 버튼으로 돌려준다
    this.setSearchBtn = (el) => { this.searchBtn = el; };
    this.openSearch = () => this.setState({ searchOpen: true });
    this.closeSearch = () => {
      this.setState({ searchOpen: false });
      setTimeout(() => { if (this.searchBtn) this.searchBtn.focus({ preventScroll: true }); }, 0);
    };
    this.setRoot = (el) => { this.rootEl = el; };
    this.setCanvas = (el) => { this.cvEl = el; };
    this.pts = {}; // 지도에 닿아 있는 손가락들
    // 커서 효과: 덧그리는 층, 커서 아래 네모, 층에 놓아 둘 네모 수만큼의 목록
    this.fxPool = Array.from({ length: FX_TRAILS + FX_PRESSES }, (_, i) => i);
    this.fxAnim = [];
    this.setFx = (el) => { this.fxEl = el; };
    this.setFxDot = (el) => { this.fxDot = el; };
    this.fxMove = (e) => this.fxTrail(e);
    this.fxDown = (e) => this.fxTap(e);
    this.fxLeave = () => this.fxHide();

    // ── 지도: 한 손가락으로 옮기고 두 손가락으로 확대·축소한다 ──
    this.down = (e) => {
      const mouse = e.pointerType === "mouse";
      if (mouse && e.button !== 0) return;
      this.touched = !mouse;
      this.pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      const ids = Object.keys(this.pts), v = this._view;
      this.panned = false;
      if (ids.length === 1) {
        const onNode = !!(e.target.closest && e.target.closest("button, a"));
        this.drag = { id: e.pointerId, x: e.clientX, y: e.clientY, k: v.k, tx: v.tx, ty: v.ty, moved: false, onNode };
        this.pinch = null;
        // 마우스로 빈 곳을 잡았을 때는 지도 밖으로 나가도 계속 따라오게 한다(손가락은 처음 닿은 곳이 끝까지 받는다)
        if (mouse && !onNode && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
      } else if (ids.length === 2) {
        this.drag = null;
        this.pinch = this.pinchStart(ids, v);
      }
    };
    this.move = (e) => {
      const p = this.pts[e.pointerId];
      if (!p) return;
      // 마우스 버튼을 지도 밖에서 뗀 경우
      if (e.pointerType === "mouse" && e.buttons === 0) { this.up(e); return; }
      p.x = e.clientX;
      p.y = e.clientY;
      if (this.pinch) {
        const g = this.pinch, a = this.pts[g.a], b = this.pts[g.b];
        if (!a || !b) return;
        const box = this.cvEl.getBoundingClientRect();
        const mx = (a.x + b.x) / 2 - box.left, my = (a.y + b.y) / 2 - box.top;
        const k = clamp(g.k * (Math.hypot(b.x - a.x, b.y - a.y) / g.d), MIN_K, MAX_K);
        this.panned = true;
        // 처음 두 손가락 사이에 있던 지도 위의 점이 지금의 손가락 사이에 오게 한다
        this.setState({ view: { k, tx: mx - g.px * k, ty: my - g.py * k } });
        return;
      }
      const d = this.drag;
      if (!d || d.id !== e.pointerId) return;
      const dx = e.clientX - d.x, dy = e.clientY - d.y;
      if (!d.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
      d.moved = true;
      this.panned = true;
      this.setState({ view: { k: d.k, tx: d.tx + dx, ty: d.ty + dy } });
    };
    this.up = (e) => {
      if (!this.pts[e.pointerId]) return;
      delete this.pts[e.pointerId];
      // 옮기거나 확대하다가 뗀 직후에 따라오는 누름은 치지 않는다. 조금 뒤에는 다시 받는다
      if (this.panned) { clearTimeout(this.panT); this.panT = setTimeout(() => { this.panned = false; }, 350); }
      const ids = Object.keys(this.pts), d = this.drag;
      if (this.pinch) {
        // 손가락 하나가 남으면 그 손가락으로 이어서 옮긴다
        this.pinch = null;
        if (ids.length === 1) { const q = this.pts[ids[0]], v = this._view; this.drag = { id: +ids[0], x: q.x, y: q.y, k: v.k, tx: v.tx, ty: v.ty, moved: true, onNode: true }; }
        return;
      }
      this.drag = null;
      // 빈 곳을 가볍게 누르면 고른 것을 푼다(요약 패널이 닫힌다)
      if (d && !d.moved && !d.onNode && this.state.selected) this.setState({ selected: null, hover: null, sheetH: null });
    };

    // ── 요약 패널의 손잡이 줄: 위아래로 끌어 높이를 바꾼다 ──
    this.gripDown = (e) => {
      if (e.target.closest && e.target.closest("button")) return;
      this.grip = { id: e.pointerId, y: e.clientY, h: this._sheetH, moved: false };
      if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
    };
    this.gripMove = (e) => {
      const g = this.grip;
      if (!g || g.id !== e.pointerId) return;
      const dy = e.clientY - g.y;
      if (!g.moved && Math.abs(dy) < 4) return;
      g.moved = true;
      this.setState({ sheetH: clamp(g.h - dy, 60, this._sheetFull) });
    };
    this.gripUp = (e) => {
      const g = this.grip;
      if (!g || (e && g.id !== e.pointerId)) return;
      this.grip = null;
      if (!g.moved) return;
      const h = this.state.sheetH, half = this._sheetHalf, full = this._sheetFull;
      if (h < SHEET_MIN) this.setState({ selected: null, hover: null, sheetH: null, sheet: "half" });
      else this.setState({ sheetH: null, sheet: h > (half + full) / 2 ? "full" : "half" });
    };
    this.toggleSheet = () => this.setState((st) => ({ sheet: st.sheet === "full" ? "half" : "full", sheetH: null }));

    this.onKey = (e) => {
      if (e.defaultPrevented || this.editing()) return;
      // 검색: ⌘K 또는 Ctrl+K(키보드를 연결했을 때)
      if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && (e.key === "k" || e.key === "K" || e.code === "KeyK")) {
        e.preventDefault();
        if (this.state.searchOpen) this.closeSearch(); else this.openSearch();
        return;
      }
      if (this.state.searchOpen) {
        if (e.key === "Escape") { e.preventDefault(); this.closeSearch(); }
        return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || e.repeat || typing(e.target)) return;
      // 한글 입력 상태에서도 같은 자리의 키로 동작하게 한다
      const ch = e.key && e.key.length === 1 ? e.key.toLowerCase() : "";
      const k = /^[a-z]$/.test(ch) ? ch : e.code === "KeyB" ? "b" : e.code === "KeyC" ? "c" : "";
      if (k !== "b" && k !== "c") return;
      e.preventDefault();
      this.go(k);
    };
  }

  // 두 손가락이 닿은 순간: 손가락 사이의 거리와, 그 가운데에 있는 지도 위의 점을 기억한다
  pinchStart(ids, v) {
    const a = this.pts[ids[0]], b = this.pts[ids[1]], box = this.cvEl.getBoundingClientRect();
    const mx = (a.x + b.x) / 2 - box.left, my = (a.y + b.y) / 2 - box.top;
    return { a: ids[0], b: ids[1], d: Math.hypot(b.x - a.x, b.y - a.y) || 1, k: v.k, px: (mx - v.tx) / v.k, py: (my - v.ty) / v.k };
  }

  isDark(st) {
    return st.theme ? st.theme === "dark" : this.props.theme === "dark";
  }

  // 캔버스에서 편집하는 동안에는 단축키를 받지 않는다
  editing() {
    const b = document.body;
    return b.hasAttribute("data-dc-editor-on") && b.getAttribute("data-dc-editor-tool") !== "interact";
  }

  // 단축키: 메뉴를 한 번 반전시킨 뒤 그 링크를 누른 것과 똑같이 이동한다
  go(k) {
    if (this.navT) return;
    this.setState({ key: k });
    this.navT = setTimeout(() => {
      this.navT = null;
      this.setState({ key: null });
      if (k === HERE) return;
      const a = this.rootEl && this.rootEl.querySelector('a[data-key="' + k + '"]');
      if (a) a.click();
    }, 140);
  }

  componentDidMount() {
    // 단축키를 바로 받을 수 있게, 이 문서에 포커스가 와 있는데 받는 요소가 없으면 화면 전체가 받는다.
    // 다른 문서의 포커스를 가져오지는 않는다
    this.onFocus = () => { if (this.rootEl && !this.editing() && document.activeElement === document.body) this.rootEl.focus({ preventScroll: true }); };
    window.addEventListener("focus", this.onFocus);
    if (document.hasFocus()) this.onFocus();
    this.measure = () => {
      const el = this.rootEl;
      if (!el) return;
      if (el.clientWidth !== this.state.rw || el.clientHeight !== this.state.rh) this.setState({ rw: el.clientWidth, rh: el.clientHeight });
    };
    this.measure();
    window.addEventListener("resize", this.measure);
    // 휠(트랙패드) 확대·축소는 기본 스크롤을 막아야 해서 직접 건다
    this.onWheel = (e) => {
      e.preventDefault();
      const v = this._view, box = this.cvEl.getBoundingClientRect();
      const mx = e.clientX - box.left, my = e.clientY - box.top;
      const k = clamp(v.k * Math.exp(-e.deltaY * 0.0016), MIN_K, MAX_K);
      this.setState({ view: { k, tx: mx - (mx - v.tx) * (k / v.k), ty: my - (my - v.ty) * (k / v.k) } });
    };
    if (this.cvEl) this.cvEl.addEventListener("wheel", this.onWheel, { passive: false });
    // 커서 효과: 화면 어디에서 움직이고 누르든 받는다. 받기만 하고 기본 동작은 건드리지 않는다
    this.reduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
    window.addEventListener("pointermove", this.fxMove, { capture: true, passive: true });
    window.addEventListener("pointerdown", this.fxDown, { capture: true, passive: true });
    document.documentElement.addEventListener("pointerleave", this.fxLeave);
  }

  componentWillUnmount() {
    window.removeEventListener("resize", this.measure);
    if (this.cvEl) this.cvEl.removeEventListener("wheel", this.onWheel);
    window.removeEventListener("focus", this.onFocus);
    window.removeEventListener("pointermove", this.fxMove, { capture: true });
    window.removeEventListener("pointerdown", this.fxDown, { capture: true });
    document.documentElement.removeEventListener("pointerleave", this.fxLeave);
    clearTimeout(this.navT);
    clearTimeout(this.panT);
  }

  // ── 커서 효과 ──
  // 그려도 되는가: 캔버스에서 편집하는 중이거나 "동작 줄이기"가 켜져 있으면 그리지 않는다
  fxOn() {
    return !!this.fxEl && !this.editing() && !(this.reduce && this.reduce.matches);
  }

  // 커서 아래 네모를 치우고, 잔상을 이어 가던 자리도 잊는다
  fxHide() {
    this.fxAt = null;
    if (this.fxDot) this.fxDot.style.visibility = "hidden";
  }

  // 층의 왼쪽 위가 문서의 어디인지
  fxOrigin(e) {
    const r = this.fxEl.getBoundingClientRect();
    this.fxOx = r.left + (e.pageX - e.clientX);
    this.fxOy = r.top + (e.pageY - e.clientY);
  }

  // i번째 네모를 (x, y)에 중심을 두고 from → to 크기로 바꾸면서 지운다. 테두리 굵기는 1px 그대로다
  fxStamp(i, x, y, k) {
    const el = this.fxEl.children[i];
    if (!el || !el.animate) return;
    const old = this.fxAnim[i];
    if (old) { old[0].cancel(); old[1].cancel(); }
    const a = k.from / 2, b = k.to / 2;
    this.fxAnim[i] = [
      el.animate([
        { left: x - a + "px", top: y - a + "px", width: k.from + "px", height: k.from + "px" },
        { left: x - b + "px", top: y - b + "px", width: k.to + "px", height: k.to + "px" },
      ], { duration: k.ms, easing: k.ease }),
      el.animate([{ opacity: k.alpha }, { opacity: 0 }], { duration: k.ms }),
    ];
  }

  // 가장 가까운 격자점에 잔상 하나. 바로 앞에 찍은 자리와 같으면 건너뛴다
  fxPut(x, y) {
    const gx = Math.round(x / FX_CELL) * FX_CELL, gy = Math.round(y / FX_CELL) * FX_CELL;
    if (gx === this.fxGx && gy === this.fxGy) return;
    this.fxGx = gx;
    this.fxGy = gy;
    this.fxN = ((this.fxN || 0) + 1) % FX_TRAILS;
    this.fxStamp(this.fxN, gx, gy, FX_TRAIL);
  }

  // 마우스가 움직일 때만 잔상을 찍는다. 터치와 펜은 지도를 옮기는 동작과 겹치므로 잔상을 남기지 않는다
  fxTrail(e) {
    if (e.pointerType !== "mouse" || !this.fxOn()) { this.fxHide(); return; }
    const x = e.clientX, y = e.clientY, d = this.fxDot;
    if (d) { d.style.left = x + "px"; d.style.top = y + "px"; d.style.visibility = "visible"; }
    const last = this.fxAt; // 마지막으로 잔상을 찍은 자리(화면 좌표, 격자에 맞추기 전)
    if (!last) { this.fxOrigin(e); this.fxAt = { x, y }; return; }
    const dx = x - last.x, dy = y - last.y, dist = Math.hypot(dx, dy);
    if (dist < FX_CELL) return;
    // 화면 좌표를 층 안의 좌표로 옮길 때 더하는 값(지금의 스크롤 − 층의 자리)
    const sx = e.pageX - x - this.fxOx, sy = e.pageY - y - this.fxOy;
    // 한 번에 아주 멀리 건너뛰었으면 사이를 잇지 않고 그 자리에만 찍는다
    if (dist > FX_CELL * 40) { this.fxAt = { x, y }; this.fxPut(x + sx, y + sy); return; }
    const n = Math.floor(dist / FX_CELL), ux = (dx / dist) * FX_CELL, uy = (dy / dist) * FX_CELL;
    for (let i = 1; i <= n; i++) this.fxPut(last.x + ux * i + sx, last.y + uy * i + sy);
    this.fxAt = { x: last.x + ux * n, y: last.y + uy * n };
  }

  // 누를 때(손가락, 펜, 마우스 왼쪽 버튼): 격자에 맞추지 않고 누른 자리 그대로에서 네모 하나가 퍼진다
  fxTap(e) {
    if (!this.fxOn() || !e.isPrimary || e.button > 0) return;
    if (e.pointerType !== "mouse") this.fxHide();
    this.fxOrigin(e);
    this.fxK = ((this.fxK || 0) + 1) % FX_PRESSES;
    this.fxStamp(FX_TRAILS + this.fxK, Math.round(e.pageX - this.fxOx), Math.round(e.pageY - this.fxOy), FX_PRESS);
  }

  // cs-layout:start
  // 펼친 상태에 맞춰 모든 상자의 자리를 정한다
  layout(expanded) {
    const rect = {}, zones = [];
    const clusterH = (id) => {
      if (!expanded[id]) return H;
      return NODE[id].kids.reduce((s, c, i) => s + (TWO[c] ? CH2 : CH) + (i ? CG : 0), H + CT);
    };
    let bandY = 0;
    const hw = [];
    [0, 1, 2].forEach((b) => {
      const zs = ZONES.filter((z) => z.band === b);
      const built = zs.map((z) => {
        const pad = (z.w - (z.cols * W + (z.cols - 1) * AV)) / 2;
        const rowH = [];
        for (let r = 0; r < z.rows; r++) rowH[r] = H;
        Object.keys(z.cells).forEach((id) => { const r = z.cells[id][1]; rowH[r] = Math.max(rowH[r], clusterH(id)); });
        const content = rowH.reduce((s, h, i) => s + h + (i ? RG : 0), 0);
        return { z, pad, rowH, h: ZT + content + ZB };
      });
      const bandH = Math.max.apply(null, built.map((q) => q.h));
      built.forEach((q) => {
        const z = q.z;
        const rowY = [];
        let y = bandY + ZT;
        q.rowH.forEach((h, r) => { rowY[r] = y; y += h + RG; });
        const colX = [];
        for (let c = 0; c < z.cols; c++) colX[c] = z.x + q.pad + c * (W + AV);
        Object.keys(z.cells).forEach((id) => {
          const c = z.cells[id][0], r = z.cells[id][1];
          rect[id] = { id, x: colX[c], y: rowY[r], w: W, h: H, big: true, zone: z.id, band: b, col: c, row: r, colX: colX[c] };
          if (expanded[id]) {
            let cy = rowY[r] + H + CT;
            NODE[id].kids.forEach((k) => {
              const h = TWO[k] ? CH2 : CH;
              rect[k] = { id: k, x: colX[c] + CI, y: cy, w: W - CI, h, big: false, zone: z.id, band: b, col: c, row: r, colX: colX[c] };
              cy += h + CG;
            });
          }
        });
        zones.push({ id: z.id, code: z.code, name: z.name, x: z.x, y: bandY, w: z.w, h: bandH, colX });
      });
      bandY += bandH;
      if (b < 2) { hw[b] = bandY; bandY += BG; }
    });
    const os = zones.filter((z) => z.id === "os")[0];
    // 운영체제 띠를 세로로 지나갈 수 있는 통로
    const through = [os.colX[0] - 18];
    for (let c = 0; c < 5; c++) through.push(os.colX[c] + W + AV / 2);
    through.push(os.colX[5] + W + 18);
    return { rect, zones, hw, through, mh: bandY };
  }

  // 점들을 지나는 선. 꺾이는 곳은 둥글게, 끝은 trim만큼 덜 그린다
  path(points, trim) {
    const pts = [];
    points.forEach((p) => {
      const q = pts[pts.length - 1];
      if (q && Math.abs(q[0] - p[0]) < 0.5 && Math.abs(q[1] - p[1]) < 0.5) return;
      if (pts.length > 1) {
        const o = pts[pts.length - 2];
        if ((Math.abs(o[0] - q[0]) < 0.5 && Math.abs(q[0] - p[0]) < 0.5) || (Math.abs(o[1] - q[1]) < 0.5 && Math.abs(q[1] - p[1]) < 0.5)) { pts[pts.length - 1] = p; return; }
      }
      pts.push(p);
    });
    const n = pts.length;
    const a = pts[n - 2], z = pts[n - 1];
    const len = Math.hypot(z[0] - a[0], z[1] - a[1]) || 1;
    const ux = (z[0] - a[0]) / len, uy = (z[1] - a[1]) / len;
    const end = [z[0] - ux * trim, z[1] - uy * trim];
    let d = "M" + pts[0][0] + " " + pts[0][1];
    for (let i = 1; i < n - 1; i++) {
      const p0 = pts[i - 1], p1 = pts[i], p2 = i === n - 2 ? end : pts[i + 1];
      const d1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), d2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      const r = Math.min(R, d1 / 2, d2 / 2);
      d += "L" + (p1[0] - ((p1[0] - p0[0]) / d1) * r).toFixed(1) + " " + (p1[1] - ((p1[1] - p0[1]) / d1) * r).toFixed(1);
      d += "Q" + p1[0] + " " + p1[1] + " " + (p1[0] + ((p2[0] - p1[0]) / d2) * r).toFixed(1) + " " + (p1[1] + ((p2[1] - p1[1]) / d2) * r).toFixed(1);
    }
    d += "L" + end[0].toFixed(1) + " " + end[1].toFixed(1);
    // 화살촉
    const bx = z[0] - ux * 7, by = z[1] - uy * 7;
    const head = "M" + z[0] + " " + z[1] + "L" + (bx - uy * 3.4).toFixed(1) + " " + (by + ux * 3.4).toFixed(1) + "L" + (bx + uy * 3.4).toFixed(1) + " " + (by - ux * 3.4).toFixed(1) + "Z";
    return { d, head };
  }

  // 같은 구역 안 큰 개념 사이: 이웃한 칸이므로 곧게 잇거나 사이 통로로 한 번 돌아간다
  routeIntra(L, a, b, expanded) {
    const A = L.rect[a], B = L.rect[b];
    const dc = B.col - A.col, dr = B.row - A.row;
    const ay = A.y + H / 2, by = B.y + H / 2;
    if (dr === 0) {
      return dc > 0 ? [[A.x + W, ay], [B.x, by]] : [[A.x, ay], [B.x + W, by]];
    }
    if (dc === 0) {
      const upper = dr > 0 ? a : b;
      if (!expanded[upper]) {
        return dr > 0 ? [[A.x + W / 2, A.y + H], [B.x + W / 2, B.y]] : [[A.x + W / 2, A.y], [B.x + W / 2, B.y + H]];
      }
      const lane = A.x + W + AV / 2, s = dr > 0 ? 1 : -1;
      return [[A.x + W, ay + 7 * s], [lane, ay + 7 * s], [lane, by - 7 * s], [B.x + W, by - 7 * s]];
    }
    const lane = (dc > 0 ? A.x + W : B.x + W) + AV / 2, s = dr > 0 ? 1 : -1;
    return [[dc > 0 ? A.x + W : A.x, ay + 7 * s], [lane, ay + 7 * s], [lane, by - 7 * s], [dc > 0 ? B.x : B.x + W, by - 7 * s]];
  }

  // 다른 구역 사이: 상자 옆 통로로 나와 띠 사이 가로 통로를 타고 간다
  routeCross(L, a, b, pre) {
    const A = L.rect[a], B = L.rect[b];
    const cx = (n) => n.x + n.w / 2;
    const side = (n, o) => (!n.big || cx(o) >= cx(n) ? 1 : -1);          // 세부 개념은 늘 오른쪽으로 나온다
    // 점선(연관 개념)은 실선과 겹치지 않게 통로 안쪽 줄을 따로 쓴다
    const lo = pre ? 9 : 13, ho = pre ? 0 : 3, flipPort = pre ? 1 : -1;
    const lane = (n, s) => (s > 0 ? n.colX + W + lo : n.colX - lo);
    const port = (n, s, dy) => [s > 0 ? n.x + n.w : n.x, n.y + n.h / 2 + dy * flipPort];
    const off = (n) => (n.big ? 7 : 5);
    const sa = side(A, B), sb = side(B, A);
    const la = lane(A, sa), lb = lane(B, sb);
    if (A.band === B.band) {
      // 같은 띠의 옆 구역: 위쪽 띠는 아래 통로로, 아래쪽 띠는 위 통로로
      const down = A.band === 0;
      const hy = (down ? L.hw[0] + 7 : L.hw[1] + 21) + ho;
      const da = (down ? 1 : -1) * off(A), db = (down ? 1 : -1) * off(B);
      const pa = port(A, sa, da), pb = port(B, sb, db);
      return [pa, [la, pa[1]], [la, hy], [lb, hy], [lb, pb[1]], pb];
    }
    const flip = A.band > B.band;
    const U = flip ? B : A, D = flip ? A : B;
    const su = flip ? sb : sa, sd = flip ? sa : sb, lu = flip ? lb : la, ld = flip ? la : lb;
    const pu = port(U, su, off(U)), pd = port(D, sd, -off(D));
    let pts;
    if (D.band - U.band === 1) {
      const hy = (U.band === 0 ? L.hw[0] + 21 : L.hw[1] + 7) + ho;
      pts = [pu, [lu, pu[1]], [lu, hy], [ld, hy], [ld, pd[1]], pd];
    } else {
      const ox = L.through.reduce((best, x) => (Math.abs(x - ld) < Math.abs(best - ld) ? x : best), L.through[0]) + (pre ? 0 : 4);
      pts = [pu, [lu, pu[1]], [lu, L.hw[0] + 14 + ho], [ox, L.hw[0] + 14 + ho], [ox, L.hw[1] + 14 + ho], [ld, L.hw[1] + 14 + ho], [ld, pd[1]], pd];
    }
    return flip ? pts.slice().reverse() : pts;
  }
  // cs-layout:end

  // 요약 패널의 높이: 기본(반), 끝까지 올렸을 때
  sheetSizes(rh) {
    const full = Math.max(200, rh - CHROME - SHEET_GAP);
    return { half: Math.min(full, Math.round(rh * SHEET_HALF)), full };
  }

  // 지도에서 패널에 가려지지 않는 높이
  clearH(rh, sheetH) {
    return Math.max(120, rh - CHROME - Math.max(LEGEND, sheetH));
  }

  // 상자 r이 보이는 영역의 가운데에 오는 보기
  centerOn(r, k, vw, vh) {
    return { k, tx: vw / 2 - (r.x + r.w / 2) * k, ty: vh / 2 - (r.y + r.h / 2) * k };
  }

  // Fit: 지금 펼쳐진 것까지 전부 보이게
  fitAll(L, vw, vh) {
    const k = clamp(Math.min((vw - 24) / MW, (vh - 24) / L.mh), MIN_K, 1.2);
    return { k, tx: (vw - MW * k) / 2, ty: Math.max(12, (vh - L.mh * k) / 2) };
  }

  renderVals() {
    const s = this.state;
    const expanded = s.expanded;
    const L = this.layout(expanded);
    const rw = s.rw || Math.min(window.innerWidth || 390, 390), rh = s.rh || window.innerHeight || 844;
    const vis = (id) => (NODE[id].big || expanded[NODE[id].parent] ? id : NODE[id].parent);
    const sel = s.selected ? vis(s.selected) : null;

    // 요약 패널의 높이와, 그 위로 보이는 지도의 높이
    const sizes = this.sheetSizes(rh);
    const sheetH = sel ? (s.sheetH !== null ? s.sheetH : sizes[s.sheet]) : 0;
    const vw = rw, vh = this.clearH(rh, sel ? Math.min(sheetH, sizes.half) : 0);
    // 처음에는 고른 개념(없으면 운영체제 구역의 가운데)이 보이는 자리에서 시작한다
    const view = s.view || this.centerOn(sel ? L.rect[sel] : L.rect["os-process"], HOME_K, vw, vh);
    this._view = view;
    this._vw = vw;
    this._vh = vh;
    this._L = L;
    this._sheetH = sheetH;
    this._sheetHalf = sizes.half;
    this._sheetFull = sizes.full;

    const hov = s.hover && L.rect[s.hover] ? s.hover : null;
    const isActive = (id) => id === sel || id === hov;

    // 선: 보이는 상자끼리로 모은 뒤 길을 낸다
    const p = { crossDash: "", crossSolid: "", crossHeads: "", tree: "", intra: "", intraHeads: "", hotHalo: "", hotDash: "", hotSolid: "", hotHeads: "" };
    const linked = {};
    const done = {};
    const order = EDGES.filter((e) => e[2]).concat(EDGES.filter((e) => !e[2]));
    order.forEach((e) => {
      const a = vis(e[0]), b = vis(e[1]);
      if (a === b) return;
      const pre = !!e[2];
      const key = pre ? a + ">" + b : a < b ? a + "~" + b : b + "~" + a;
      if (done[key]) return;
      if (!pre && (done[a + ">" + b] || done[b + ">" + a])) return;
      done[key] = true;
      const hot = isActive(a) || isActive(b);
      if (hot) { linked[a] = true; linked[b] = true; }
      const same = NODE[a].zone === NODE[b].zone;
      const pts = same ? this.routeIntra(L, a, b, expanded) : this.routeCross(L, a, b, pre);
      const seg = this.path(pts, pre ? 5 : 0);
      if (hot) {
        p.hotHalo += seg.d;
        if (pre) { p.hotSolid += seg.d; p.hotHeads += seg.head; } else p.hotDash += seg.d;
      } else if (same) {
        p.intra += seg.d; p.intraHeads += seg.head;
      } else if (pre) {
        p.crossSolid += seg.d; p.crossHeads += seg.head;
      } else {
        p.crossDash += seg.d;
      }
    });
    // 펼친 묶음의 가지
    Object.keys(expanded).forEach((id) => {
      if (!expanded[id]) return;
      const B = L.rect[id], kids = NODE[id].kids;
      const last = L.rect[kids[kids.length - 1]];
      const x = B.x + 4;
      p.tree += "M" + x + " " + (B.y + H) + "V" + (last.y + last.h / 2);
      kids.forEach((k) => { const c = L.rect[k]; p.tree += "M" + x + " " + (c.y + c.h / 2) + "H" + c.x; });
    });

    const select = (id) => {
      this.setState((st) => {
        const next = { selected: id, hover: null, sheetH: null };
        const par = NODE[id].parent;
        let ex = st.expanded;
        if (par && !ex[par]) { ex = Object.assign({}, ex); ex[par] = true; next.expanded = ex; }
        // 고른 개념이 패널 위로 보이는 영역 밖에 있으면 그 가운데로 데려온다
        const L2 = this.layout(ex), r = L2.rect[id];
        const rh2 = st.rh || window.innerHeight || 844, vw2 = this._vw, vh2 = this.clearH(rh2, this.sheetSizes(rh2).half);
        const v = st.view || this._view;
        const sx = v.tx + (r.x + r.w / 2) * v.k, sy = v.ty + (r.y + r.h / 2) * v.k;
        if (sx < 48 || sx > vw2 - 48 || sy < 72 || sy > vh2 - 28) next.view = this.centerOn(r, v.k, vw2, vh2);
        return next;
      });
    };

    const nodes = Object.keys(L.rect).map((id) => {
      const r = L.rect[id], n = NODE[id];
      const on = id === sel, filled = n.big ? hasAny(id) : has(id);
      const ink = filled ? "var(--ink)" : "var(--ink-3)";
      return {
        cls: on ? "sel" : "",
        x: r.x, y: r.y, w: r.w, h: r.h,
        big: n.big,
        pl: n.big ? 9 : 8, pr: n.big ? 8 : 5,
        fs: n.big ? 14 : 12,
        lh: n.big ? 18 : TWO[id] ? 15 : 16,
        fw: filled ? 500 : 400,
        fg: on ? "var(--bg)" : ink,
        bg: on ? "var(--ink)" : "var(--panel)",
        bd: on ? "var(--ink)" : n.big ? (filled ? "var(--ink)" : "var(--line-2)") : "var(--line)",
        ol: !on && linked[id] ? "1px solid var(--ink)" : "0 solid transparent",
        mk: filled ? (on ? "var(--bg)" : "var(--ink)") : "transparent",
        mkb: on ? "var(--bg)" : ink,
        ws: TWO[id] ? "pre-line" : "nowrap",
        label: TWO[id] ? soft(n.title) : n.title,
        sign: n.big ? (expanded[id] ? "−" : "+") : "",
        exp: n.big ? !!expanded[id] : undefined,
        // 마우스를 올렸을 때만(손가락으로 누른 뒤에 따라오는 마우스 이벤트는 받지 않는다)
        enter: () => { if (!Object.keys(this.pts).length && !this.touched && this.state.hover !== id) this.setState({ hover: id }); },
        click: () => {
          // 지도를 옮기거나 확대하다가 뗀 것은 누른 것으로 치지 않는다
          if (this.panned) return;
          if (!n.big) return select(id);
          this.setState((st) => {
            const ex = Object.assign({}, st.expanded);
            ex[id] = !ex[id];
            return { expanded: ex, selected: id, hover: null, sheetH: null };
          });
        },
      };
    });

    const zones = L.zones.map((z) => {
      const ids = Object.keys(NODE).filter((id) => NODE[id].zone === z.id);
      return { x: z.x, y: z.y, w: z.w, h: z.h, lx: z.x + 12, ly: z.y - 9, code: z.code, name: z.name, stat: ids.filter(has).length + "/" + ids.length };
    });

    // 요약 패널
    let panel = null;
    if (sel) {
      const n = NODE[sel], z = ZONE_OF[n.zone], post = POSTS[sel];
      const item = (id, note, plain) => {
        const m = NODE[id], f = m.big ? hasAny(id) : has(id);
        return {
          title: m.title, note: note || "",
          where: plain ? "" : ZONE_OF[m.zone].code + (m.parent ? " · " + NODE[m.parent].title : ""),
          mk: f ? "var(--ink)" : "transparent", mkb: f ? "var(--ink)" : "var(--ink-3)",
          fg: f ? "var(--ink)" : "var(--ink-2)", fw: f ? 500 : 400,
          go: () => select(id),
        };
      };
      const before = [], after = [], related = [];
      EDGES.forEach((e) => {
        if (e[0] !== sel && e[1] !== sel) return;
        const other = e[0] === sel ? e[1] : e[0];
        if (!e[2]) related.push(item(other, e[3]));
        else if (e[1] === sel) before.push(item(other, e[3]));
        else after.push(item(other, e[3]));
      });
      const groups = [];
      if (n.big) groups.push({ sym: "└", label: "세부 개념", n: n.kids.length, items: n.kids.map((k) => item(k, "", true)) });
      if (before.length) groups.push({ sym: "←", label: "선수 지식", n: before.length, items: before });
      if (after.length) groups.push({ sym: "→", label: "다음 개념", n: after.length, items: after });
      if (related.length) groups.push({ sym: "··", label: "연관 개념", n: related.length, items: related });
      const withPost = n.kids.filter(has).length;
      panel = {
        code: z.code,
        path: z.name + (n.parent ? " › " + NODE[n.parent].title : ""),
        title: n.title,
        mk: post || (n.big && withPost) ? "var(--ink)" : "transparent",
        mkb: post || (n.big && withPost) ? "var(--ink)" : "var(--ink-3)",
        status: post ? "글 있음 · " + post[0] : n.big ? "세부 개념 " + n.kids.length + "개 · 글 " + withPost + "개" : "작성 전",
        summary: post ? post[1] : n.big ? "세부 개념을 고르면 요약과 연결된 개념을 볼 수 있습니다." : "이 개념의 글은 아직 쓰지 않았습니다. 아래에 연결된 개념부터 읽어 보세요.",
        sumColor: post ? "var(--ink)" : "var(--ink-3)",
        groups, hasPost: !!post, noPost: !post,
        foot: n.big ? "세부 개념을 고르면 글로 이어집니다" : "아직 글이 없습니다",
      };
    }
    // 패널이 닫혀 있다가 열릴 때만 올라오는 움직임을 준다. 처음부터 열려 있는 화면에서는 가만히 있다
    if (!panel) this.sawClosed = true;
    const rise = !!panel && !!this.sawClosed;

    const zoom = (f) => () => {
      const v = this._view, cx = this._vw / 2, cy = this._vh / 2;
      const k = clamp(v.k * f, MIN_K, MAX_K);
      this.setState({ view: { k, tx: cx - (cx - v.tx) * (k / v.k), ty: cy - (cy - v.ty) * (k / v.k) } });
    };

    // 테마: 링크와 단축키는 지금 보고 있는 테마의 화면으로 이어진다
    const dark = this.isDark(s);
    const file = (k) => FILES[k] + (dark ? "Dark" : "") + ".dc.html";
    const full = s.sheet === "full" && s.sheetH === null;

    return {
      dark, themeCls: dark ? "dark" : "", toggleTheme: this.toggleTheme,
      to: { home: file("home"), main: file("main"), post: file("post"), map: file("map") },
      searchOpen: s.searchOpen, openSearch: this.openSearch, closeSearch: this.closeSearch, setSearchBtn: this.setSearchBtn,
      p, nodes, zones,
      mw: MW, mh: L.mh,
      k: view.k.toFixed(4), tx: view.tx.toFixed(1), ty: view.ty.toFixed(1),
      gs: (16 * view.k * (view.k < 0.6 ? 2 : 1)).toFixed(2),
      postCount: Object.keys(POSTS).length, nodeCount: Object.keys(NODE).length,
      panelOpen: !!panel, sel: panel || { groups: [] },
      sheetH: Math.round(sheetH),
      sheetCls: (s.sheetH !== null ? "drag" : "") + (rise ? " anim" : ""),
      sheetFull: full,
      sizeLabel: full ? "요약 줄이기" : "요약 크게 보기",
      sizeIcon: full ? "M2 5l5 5 5-5" : "M2 9l5-5 5 5",
      toggleSheet: this.toggleSheet,
      gripDown: this.gripDown, gripMove: this.gripMove, gripUp: this.gripUp,
      setRoot: this.setRoot, setCanvas: this.setCanvas,
      fxPool: this.fxPool, setFx: this.setFx, setFxDot: this.setFxDot,
      onKey: this.onKey,
      hitB: s.key === "b" ? "hit" : "",
      hitC: s.key === "c" ? "hit" : "",
      leave: () => { if (this.state.hover) this.setState({ hover: null }); },
      closePanel: () => this.setState({ selected: null, hover: null, sheetH: null, sheet: "half" }),
      zoomIn: zoom(1.25), zoomOut: zoom(1 / 1.25),
      fit: () => this.setState({ view: this.fitAll(this._L, this._vw, this._vh) }),
      down: this.down, move: this.move, up: this.up,
    };
  }
}
</script>
</body>
</html>
