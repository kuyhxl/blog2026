# 검사. main에 올리거나 PR을 열면 린트, 가짜 볼트 동기화·빌드, 누출 검사, 실제 빌드를 돌린다(CLAUDE.md "배포")
# 배포는 Cloudflare Workers Builds가 한다. 이 워크플로는 아무것도 올리지 않는다
# - 검사 순서는 package.json의 build:checked 한 곳에 있다. Cloudflare의 빌드 명령도 같은 스크립트를 쓴다
# - 권한은 저장소 읽기만 준다
# - 바깥 Action은 커밋 SHA로 고정한다. 판을 올릴 때는 태그가 가리키는 SHA를 확인해 바꾸고, 뒤의 판 주석도 함께 고친다
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# 같은 브랜치에 새 커밋이 오면 앞의 검사는 멈춘다
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 판은 mise.toml에서 읽는다(Cloudflare 빌드는 NODE_VERSION 빌드 변수. CLAUDE.md "배포")
      - id: node
        run: |
          v=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          # 캐시를 쓰지 않는다. 다른 실행이 남긴 캐시가 검사에 섞이지 않게 한다
          package-manager-cache: false

      # 의존성의 설치 스크립트는 돌리지 않는다. 지금 설치 스크립트가 있는 것은 린트 쪽 unrs-resolver와
      # 배포 쪽 wrangler가 쓰는 esbuild·workerd다. 검사는 wrangler를 쓰지 않고, 린트는 설치 스크립트 없이도 돈다
      - run: npm ci --ignore-scripts
      - run: npm run build:checked
