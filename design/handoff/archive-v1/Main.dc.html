<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>글 목록 · Blog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F6}
/* 토큰: 라이트. 다크는 같은 이름에 다른 값을 넣는다 */
.bx{--bg:#F3F5F6;--sunken:#E9ECEE;--ink:#17191C;--ink-2:#454A50;--ink-3:#666B71;--line:rgba(23,25,28,.14);--line-2:rgba(23,25,28,.3);--dot:rgba(23,25,28,.22);--hover:rgba(23,25,28,.05);--veil:rgba(243,245,246,.92);--ease:cubic-bezier(.22,1,.36,1);--sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.bx:focus,.bx:focus-visible{outline:none}
.bx *,.bx *::before,.bx *::after{box-sizing:border-box}
.bx a{color:inherit;text-decoration:none}
.bx button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer}
.bx :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bx .mono{font-family:var(--mono);font-size:12px;line-height:1;letter-spacing:.04em;text-transform:uppercase}

/* 메뉴: [키] 이름. 현재 화면은 이름에 밑줄 */
.bx .nk{color:var(--ink-3)}
.bx .nk.cur{color:var(--ink)}
.bx .nk.cur .l{text-decoration:underline;text-underline-offset:6px}
.bx .nk .k{color:var(--ink-3)}

/* 호버: 옅은 띠와 글자색만 바뀐다. 움직이거나 커지지 않는다 */
@media (hover:hover){
.bx .nk:hover{color:var(--ink)}
.lk:hover{text-decoration:underline;text-underline-offset:4px}
.ghost:hover{background:var(--hover)}
.solid:hover{background:var(--ink);color:var(--bg)}
.row-h:hover{background:var(--hover)}
.t:hover .arr{opacity:1}
.chk:hover .chk-i{border-color:var(--ink)}
.chk:hover .chk-l{color:var(--ink)!important}
}
.t:focus-visible .arr{opacity:1}
.bx .arr{margin-left:10px;vertical-align:1px;opacity:0;transition:opacity .15s linear}
/* 단축키를 누른 순간 */
.bx .nk.hit{color:var(--bg);background:var(--ink)}
.bx .nk.hit .k{color:var(--bg)}

.chk-i{appearance:none;-webkit-appearance:none;flex:none;width:14px;height:14px;margin:0;border:1px solid var(--ink-3);border-radius:0;background:transparent;display:grid;place-content:center;cursor:pointer}
.chk-i:checked{border-color:var(--ink)}
.chk-i:checked::after{content:"";width:8px;height:8px;background:var(--ink)}

/* 글 행: 펼친 행은 띠가 남는다. 방금 누른 행(.anim)만 움직인다 */
.row.open .row-h{background:var(--hover)}
.xp{display:grid;grid-template-rows:0fr;visibility:hidden}
.xp-in{min-height:0;overflow:hidden}
.xp-c{opacity:0}
.row.open .xp{grid-template-rows:1fr;visibility:visible}
.row.open .xp-c{opacity:1}
.row.anim .xp{transition:grid-template-rows .7s var(--ease),visibility 0s linear .7s}
.row.anim.open .xp{transition:grid-template-rows .7s var(--ease),visibility 0s linear}
.row.anim .xp-c{transition:opacity .18s linear}
.row.anim.open .xp-c{transition:opacity .4s linear .08s}
.pm .v{transform-origin:7px 7px}
.row.open .pm .v{transform:rotate(90deg)}
.row.anim .pm .v{transition:transform .6s var(--ease)}
/* 필터나 정렬이 바뀌면 목록이 한 번 옅게 다시 나타난다 */
@keyframes la{from{opacity:.3}to{opacity:1}}
@keyframes lb{from{opacity:.3}to{opacity:1}}
.rows.a{animation:la .24s ease-out}
.rows.b{animation:lb .24s ease-out}

/* 브레인 맵: 점과 선의 자리는 스크립트가 매 프레임 옮기고, 강조는 클래스로 바꾼다 */
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes wi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fig-l{animation:fi .4s ease-out both}
.veil{animation:fi .18s linear both}
.win{animation:wi .32s var(--ease) both}
.gl{stroke:var(--ink);stroke-width:1;stroke-opacity:.32;transition:stroke-opacity .2s linear}
.gl.faint{stroke-opacity:.1}
.gl.hot{stroke-opacity:1;stroke-width:1.25}
.gl.lg.hot{stroke-width:1.5}
.gn{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;transition:opacity .2s linear}
.gn .sq{width:6px;height:6px;background:var(--ink);outline:1px solid transparent;outline-offset:2px;transition:width .18s ease-out,height .18s ease-out}
.gn.near .sq{width:8px;height:8px}
.gn.hot .sq{width:10px;height:10px;outline-color:var(--ink)}
.gn.far{opacity:.3}
.gn.dim{opacity:.16}
.gn.dim.hot{opacity:1}
.fig.grab,.fig.grab .gn{cursor:grabbing}
.gn.lg{width:auto;height:24px;margin:-12px 0 0 -12px;display:flex;align-items:center}
.gn.lg .hit{width:24px;height:24px;flex:none;display:grid;place-items:center}
.gn.lg .sq{width:8px;height:8px;outline-offset:3px}
.gn.lg.near .sq{width:10px;height:10px}
.gn.lg.hot .sq{width:12px;height:12px}
.gn.lg .lb{padding:2px 4px;font-size:12px;line-height:1.2;white-space:nowrap;color:var(--ink-2);background:var(--bg)}
.gn.lg.near .lb{color:var(--ink)}
.gn.lg.hot .lb{color:var(--ink);font-weight:600}

@media (prefers-reduced-motion:reduce){
.row.anim .xp,.row.anim .xp-c,.row.anim .pm .v,.gl,.gn,.gn .sq,.bx .arr{transition:none!important}
.rows.a,.rows.b,.fig-l,.veil,.win{animation:none}
}
</style>
</helmet>
<div class="bx" ref="{{setRoot}}" tabIndex="-1" onKeyDown="{{onKey}}" style="position: relative">

  <header style="height: 64px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line)">
    <div style="display: flex; align-items: center; gap: 32px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; letter-spacing: -0.01em">
        <span aria-hidden="true" style="width: 10px; height: 10px; background: var(--ink)"></span>
        <span>[사이트 이름]</span>
      </a>
      <nav aria-label="주 메뉴" style="display: flex; align-items: center; gap: 8px">
        <a class="mono nk cur {{hitB}}" href="Main.dc.html" data-key="b" aria-current="page" aria-keyshortcuts="B" style="height: 32px; padding: 0 8px; display: flex; align-items: center; gap: 6px">
          <span class="k" aria-hidden="true">[B]</span>
          <span class="l">Blog</span>
        </a>
        <a class="mono nk {{hitC}}" href="BeautyOfCS.dc.html" data-key="c" aria-keyshortcuts="C" style="height: 32px; padding: 0 8px; display: flex; align-items: center; gap: 6px">
          <span class="k" aria-hidden="true">[C]</span>
          <span class="l">Beauty of CS</span>
        </a>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button class="ghost" type="button" style="height: 40px; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-2)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><circle cx="6" cy="6" r="4.25"></circle><path d="M9.2 9.2 13 13"></path></svg>
        <span class="mono">Search</span>
        <span class="mono" style="font-size: 11px; color: var(--ink-3); border: 1px solid var(--line-2); padding: 3px 5px">⌘K</span>
      </button>
      <button class="ghost" type="button" aria-label="테마 전환" style="width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-2)">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.25"></circle><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"></path></svg>
      </button>
    </div>
  </header>

  <div style="padding: 56px 48px 44px">
    <h1 style="margin: 0; display: flex; align-items: flex-start; gap: 10px; font-size: 120px; line-height: 0.95; font-weight: 300; letter-spacing: -0.045em">
      <span>Blog</span>
      <span aria-live="polite" style="margin-top: 14px; font-family: var(--mono); font-size: 15px; line-height: 1; font-weight: 400; letter-spacing: 0">({{count}})</span>
    </h1>
  </div>

  <div style="padding: 0 48px; display: grid; grid-template-columns: 272px minmax(0, 1fr); column-gap: 64px; align-items: start">

    <aside style="position: sticky; top: 24px; display: flex; flex-direction: column; max-height: calc(100vh - 48px)">
      <div style="flex: none; height: 36px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--ink)">
        <span class="mono">/Filters</span>
        <sc-if value="{{hasFilter}}" hint-placeholder-val="{{ false }}">
          <button class="mono lk" type="button" onClick="{{clearFilters}}" style="color: var(--ink-3)">Reset ×</button>
        </sc-if>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 0 2px; display: flex; flex-direction: column">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
          <fieldset style="margin: 0; padding: 0 0 6px; border: 0; min-width: 0">
            <legend class="mono" style="padding: 14px 0 6px; font-size: 11px; color: var(--ink-3)">{{g.label}}</legend>
            <div style="display: grid; grid-template-columns: {{g.cols}}; column-gap: 24px">
              <sc-for list="{{g.items}}" as="f" hint-placeholder-count="3">
                <label class="chk" style="min-width: 0; height: 26px; display: flex; align-items: center; gap: 9px; cursor: pointer">
                  <input class="chk-i" type="checkbox" checked="{{f.on}}" onChange="{{f.toggle}}">
                  <span class="chk-l" style="flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 1; white-space: nowrap; color: {{f.color}}; font-weight: {{f.weight}}">{{f.name}}</span>
                  <span style="font-family: var(--mono); font-size: 12px; line-height: 1; color: var(--ink-3)">{{f.count}}</span>
                </label>
              </sc-for>
            </div>
          </fieldset>
        </sc-for>
      </div>

      <figure aria-label="글 연결 그래프" style="flex: none; margin: 14px 0 0; border: 1px solid var(--ink); background: var(--bg)">
        <div style="height: 28px; padding: 0 3px 0 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ink); background: var(--sunken)">
          <span class="mono" style="font-size: 11px; white-space: nowrap">[ FIG. 01 ]</span>
          <span aria-hidden="true" style="flex: 1 1 auto; height: 9px; background: repeating-linear-gradient(to bottom, var(--line-2) 0 1px, transparent 1px 4px)"></span>
          <button class="ghost" type="button" ref="{{setOpenBtn}}" aria-label="그래프 크게 보기" onClick="{{openGraph}}" style="width: 22px; height: 22px; display: grid; place-items: center">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M7 1h4v4M5 11H1V7M11 1 7 5M1 11l4-4"></path></svg>
          </button>
        </div>
        <div class="fig {{figCls}}" ref="{{setFigS}}" onPointerMove="{{figMove}}" onPointerUp="{{figUp}}" onPointerCancel="{{figUp}}" onMouseLeave="{{leave}}" style="position: relative; height: 200px; overflow: hidden; background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.4px); background-size: 12px 12px; background-position: 3px 6px">
          <div class="fig-l" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%">
            <svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; fill: none">
              <sc-for list="{{edges}}" as="e" hint-placeholder-count="0">
                <line class="gl {{e.cls}}" x1="0" y1="0" x2="0" y2="0"></line>
              </sc-for>
            </svg>
            <sc-for list="{{nodes}}" as="n" hint-placeholder-count="0">
              <a class="gn {{n.cls}}" href="Post.dc.html" tabIndex="-1" draggable="false" aria-label="{{n.title}}" onPointerDown="{{n.down}}" onMouseEnter="{{n.enter}}" onMouseLeave="{{leave}}" onClick="{{nodeClick}}" style="transform: translate({{n.x0}}px, {{n.y0}}px)">
                <span class="sq"></span>
              </a>
            </sc-for>
          </div>
        </div>
        <figcaption style="height: 28px; padding: 0 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line-2); white-space: nowrap; overflow: hidden">
          <sc-if value="{{hasActive}}" hint-placeholder-val="{{ false }}">
            <span style="font-family: var(--mono); font-size: 11px; color: var(--ink-3)">{{activeDate}}</span>
            <span style="min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis">{{activeTitle}}</span>
          </sc-if>
          <sc-if value="{{noActive}}" hint-placeholder-val="{{ true }}">
            <span class="mono" style="font-size: 11px; color: var(--ink-3)">{{graphStat}}</span>
          </sc-if>
        </figcaption>
      </figure>
    </aside>

    <section aria-label="글 목록" style="min-width: 0">
      <div style="height: 36px; display: flex; align-items: center; border-bottom: 1px solid var(--ink)">
        <span style="width: 24px; flex: none"></span>
        <button class="mono lk" type="button" onClick="{{sortDate}}" style="width: 128px; flex: none; text-align: left; color: {{dateColor}}">/Date {{dateArrow}}</button>
        <button class="mono lk" type="button" onClick="{{sortName}}" style="flex: none; text-align: left; color: {{nameColor}}">/Name {{nameArrow}}</button>
        <span style="flex: 1 1 auto"></span>
        <span class="mono" style="color: var(--ink-3)">{{shownLabel}}</span>
      </div>

      <div class="rows {{rowsCls}}">
        <sc-for list="{{rows}}" as="p" hint-placeholder-count="8">
          <article class="row {{p.cls}}" onMouseEnter="{{p.enter}}" onMouseLeave="{{leave}}" style="border-bottom: 1px solid var(--line)">
            <div class="row-h" style="display: flex; align-items: center; min-height: 60px">
              <span aria-hidden="true" style="width: 8px; height: 8px; flex: none; margin-right: 16px; background: var(--ink)"></span>
              <time style="width: 128px; flex: none; font-family: var(--mono); font-size: 12.5px; line-height: 1">{{p.date}}</time>
              <a class="t" href="Post.dc.html" style="flex: 1 1 auto; min-width: 0; padding: 14px 24px 14px 0; font-size: 24px; line-height: 1.3; letter-spacing: -0.02em; word-break: keep-all">{{p.title}}&#8288;<svg class="arr" width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M1 6h15M11 1l5 5-5 5"></path></svg></a>
              <button class="pm" type="button" aria-expanded="{{p.open}}" aria-controls="{{p.panel}}" aria-label="{{p.toggleLabel}}" onClick="{{p.toggle}}" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M2 7h10"></path><path class="v" d="M7 2v10"></path></svg>
              </button>
            </div>
            <div class="xp" id="{{p.panel}}">
              <div class="xp-in">
                <div class="xp-c" style="display: grid; grid-template-columns: 128px minmax(0, 1fr); row-gap: 18px; padding: 12px 44px 32px 24px">
                  <span class="mono" style="padding-top: 8px; color: var(--ink-3)">Summary</span>
                  <p style="margin: 0; max-width: 640px; font-size: 16px; line-height: 1.75; color: var(--ink-2); word-break: keep-all">{{p.summary}}</p>
                  <span class="mono" style="padding-top: 7px; color: var(--ink-3)">Tags</span>
                  <div style="display: flex; flex-wrap: wrap; gap: 6px">
                    <sc-for list="{{p.tags}}" as="tg" hint-placeholder-count="2">
                      <span style="padding: 6px 8px; font-size: 12.5px; line-height: 1; border: 1px solid var(--line-2)">{{tg}}</span>
                    </sc-for>
                  </div>
                  <span></span>
                  <a class="mono solid" href="Post.dc.html" style="justify-self: start; height: 40px; padding: 0 16px; display: inline-flex; align-items: center; gap: 12px; border: 1px solid var(--ink)">
                    <span>Read</span>
                    <span aria-hidden="true">→</span>
                  </a>
                </div>
              </div>
            </div>
          </article>
        </sc-for>
      </div>

      <sc-if value="{{noRows}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; padding: 40px 0 40px 24px; font-size: 16px; color: var(--ink-2)">고른 조건에 맞는 글이 없습니다.</p>
      </sc-if>
    </section>
  </div>

  <footer style="margin-top: 120px; padding: 28px 48px 40px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line)">
    <span style="display: flex; align-items: center; gap: 8px; color: var(--ink-3)">
      <span class="mono">© 2026</span>
      <span style="font-size: 13px; line-height: 1">[사이트 이름]</span>
    </span>
    <nav aria-label="바깥 링크" style="display: flex; align-items: center; gap: 24px">
      <a class="mono lk" href="#">GitHub ↗</a>
      <a class="mono lk" href="#">RSS</a>
      <a class="mono lk" href="#">Email</a>
    </nav>
  </footer>

  <sc-if value="{{graphOpen}}" hint-placeholder-val="{{ false }}">
    <div class="veil" onClick="{{closeGraph}}" style="position: fixed; inset: 0; z-index: 50; padding: 72px 48px 48px; display: flex; justify-content: center; align-items: flex-start; background: var(--veil)">
      <figure class="win" role="dialog" aria-modal="true" aria-label="글 연결 그래프" onClick="{{stop}}" style="width: 100%; max-width: 1120px; margin: 0; border: 1px solid var(--ink); background: var(--bg); box-shadow: 10px 10px 0 var(--line)">
        <div style="height: 36px; padding: 0 4px 0 14px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--ink); background: var(--sunken)">
          <span class="mono" style="white-space: nowrap">[ FIG. 01 ]</span>
          <span class="mono" style="white-space: nowrap; color: var(--ink-3)">Post graph</span>
          <span aria-hidden="true" style="flex: 1 1 auto; height: 13px; background: repeating-linear-gradient(to bottom, var(--line-2) 0 1px, transparent 1px 4px)"></span>
          <button class="ghost" type="button" ref="{{setCloseBtn}}" aria-label="그래프 닫기" onClick="{{closeGraph}}" style="width: 28px; height: 28px; display: grid; place-items: center">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"></path></svg>
          </button>
        </div>
        <div class="fig {{figCls}}" ref="{{setFigL}}" onPointerMove="{{figMove}}" onPointerUp="{{figUp}}" onPointerCancel="{{figUp}}" onMouseLeave="{{leave}}" style="position: relative; height: 600px; overflow: hidden; background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.4px); background-size: 16px 16px; background-position: 7px 4px">
          <div class="fig-l" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%">
            <svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; fill: none">
              <sc-for list="{{edges}}" as="e" hint-placeholder-count="0">
                <line class="gl lg {{e.cls}}" x1="0" y1="0" x2="0" y2="0"></line>
              </sc-for>
            </svg>
            <sc-for list="{{nodes}}" as="n" hint-placeholder-count="0">
              <a class="gn lg {{n.cls}}" href="Post.dc.html" draggable="false" onPointerDown="{{n.down}}" onMouseEnter="{{n.enter}}" onMouseLeave="{{leave}}" onClick="{{nodeClick}}">
                <span class="hit"><span class="sq"></span></span>
                <span class="lb">{{n.short}}</span>
              </a>
            </sc-for>
          </div>
        </div>
        <figcaption style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 20px; border-top: 1px solid var(--line-2); white-space: nowrap; overflow: hidden">
          <span class="mono" style="color: var(--ink-3)">{{graphStat}}</span>
          <sc-if value="{{hasActive}}" hint-placeholder-val="{{ false }}">
            <span style="display: flex; align-items: center; gap: 10px; min-width: 0">
              <span aria-hidden="true" style="width: 8px; height: 8px; flex: none; background: var(--ink)"></span>
              <span style="font-family: var(--mono); font-size: 12px; color: var(--ink-3)">{{activeDate}}</span>
              <span style="min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis">{{activeTitle}}</span>
            </span>
          </sc-if>
          <span style="flex: 1 1 auto"></span>
          <span style="font-size: 12px; color: var(--ink-3)">점은 글, 선은 글 사이의 링크. 점을 끌어 옮길 수 있습니다</span>
        </figcaption>
      </figure>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2440}}'>
// 예시 데이터: 글 제목과 요약은 화면 확인용 샘플이다. x, y는 연결 그래프에서의 위치(0~1).

// ── 브레인 맵의 움직임 ─────────────────────────────────────────────────────
// 계산은 작은 창의 안쪽 크기(270×200) 좌표에서 하고, 그릴 때 각 창의 크기에 맞춘다.
const SW = 270, SH = 200, PAD = 12;
const K_HOME = 0.012;  // 제자리로 돌아가려는 힘
const K_LINK = 0.009;  // 연결된 점끼리 원래 거리를 지키려는 힘 (끌면 이웃이 따라온다)
const K_PUSH = 0.25;   // 겹치지 않게 서로 밀어내는 힘
const DAMP = 0.76;     // 프레임마다 남는 속도
const AMP = 4;         // 가만히 있을 때 떠다니는 폭(px)
const HERE = 'b';      // 이 화면의 단축키
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// 글자를 입력하는 자리에서는 단축키를 받지 않는다
const typing = (t) => !!t && (t.isContentEditable || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset)$/.test(t.type)));

class Component extends DCLogic {
  constructor(props) {
    super(props);
    // order: 펼친 행을 펼친 순서대로. 맨 뒤가 그래프에서 표시되는 글이다
    this.state = { sort: 'date', dir: 'desc', open: { paging: true }, order: ['paging'], anim: null, rev: 0, hover: null, via: null, drag: false, key: null, types: {}, topics: {}, graphOpen: false };
    // 방향을 뺀 연결과 이웃 목록
    const seen = {};
    this.pairs = [];
    this.adj = {};
    LINKS.forEach(([a, b]) => {
      const k = a < b ? a + '|' + b : b + '|' + a;
      if (seen[k]) return;
      seen[k] = true;
      this.pairs.push([a, b]);
      (this.adj[a] = this.adj[a] || {})[b] = true;
      (this.adj[b] = this.adj[b] || {})[a] = true;
    });
    this.byId = {};
    POSTS.forEach((p) => { this.byId[p.id] = p; });

    // 점: 작은 창에 여백 없이 차도록 맞춘 자리가 제자리(hx, hy)다
    const xs = POSTS.map((p) => p.x), ys = POSTS.map((p) => p.y);
    const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    this.simOf = {};
    this.sim = POSTS.map((p, i) => {
      const x = (0.07 + ((p.x - x0) / (x1 - x0)) * 0.86) * SW, y = (0.09 + ((p.y - y0) / (y1 - y0)) * 0.82) * SH;
      const n = { id: p.id, x, y, vx: 0, vy: 0, ax: 0, ay: 0, hx: x, hy: y, x0: x.toFixed(1), y0: y.toFixed(1), p1: i * 2.399963, p2: i * 1.731 + 0.6, w1: 0.00052 + (i % 5) * 0.00007, w2: 0.00041 + (i % 7) * 0.00005 };
      this.simOf[p.id] = n;
      return n;
    });
    this.links = this.pairs.map(([a, b]) => {
      const A = this.simOf[a], B = this.simOf[b];
      return { a: A, b: B, len: Math.hypot(B.hx - A.hx, B.hy - A.hy) };
    });
    // 서로 밀어내기 시작하는 거리: 처음 배치에서는 아무도 밀리지 않게 잡는다
    this.reach = 14;
    for (let i = 0; i < this.sim.length; i++) for (let j = i + 1; j < this.sim.length; j++) {
      this.reach = Math.min(this.reach, Math.hypot(this.sim[i].hx - this.sim[j].hx, this.sim[i].hy - this.sim[j].hy) * 0.92);
    }
    this.amp = 0;
    this.held = null;
    this.figS = null;
    this.figL = null;

    this.setRoot = (el) => { this.rootEl = el; };
    this.setFigS = (el) => { this.figS = el ? { el, large: false } : null; };
    this.setFigL = (el) => { this.figL = el ? { el, large: true } : null; };
    this.setOpenBtn = (el) => { this.openBtn = el; };
    this.setCloseBtn = (el) => { if (el) el.focus({ preventScroll: true }); };

    // 행과 점의 손잡이. via는 어디에 마우스를 올렸는지: 행이면 그 점만 강조하고, 점이면 나머지를 흐리게 한다
    this.rowEnters = {};
    this.enters = {};
    this.downs = {};
    this.toggles = {};
    POSTS.forEach((p) => {
      this.rowEnters[p.id] = () => { if (!this.held && this.state.hover !== p.id) this.setState({ hover: p.id, via: 'row' }); };
      this.enters[p.id] = () => { if (!this.held && (this.state.hover !== p.id || this.state.via !== 'node')) this.setState({ hover: p.id, via: 'node' }); };
      this.downs[p.id] = (e) => this.grab(p.id, e);
      this.toggles[p.id] = () => this.setState((st) => {
        const next = Object.assign({}, st.open);
        next[p.id] = !next[p.id];
        const order = st.order.filter((id) => id !== p.id);
        if (next[p.id]) order.push(p.id);
        return { open: next, order, anim: p.id };
      });
    });
    this.leave = () => { if (!this.held && this.state.hover) this.setState({ hover: null }); };

    this.figMove = (e) => {
      const h = this.held;
      if (!h || e.pointerId !== h.pid) return;
      if (!h.moved) {
        if (Math.abs(e.clientX - h.sx) + Math.abs(e.clientY - h.sy) < 4) return;
        h.moved = true;
        this.setState({ drag: true, hover: h.n.id, via: 'node' });
      }
      const r = h.f.el.getBoundingClientRect(), m = h.f.m;
      h.n.x = clamp((e.clientX - r.left - m.ox) / m.kx + h.dx, PAD, SW - PAD);
      h.n.y = clamp((e.clientY - r.top - m.oy) / m.ky + h.dy, PAD, SH - PAD);
    };
    this.figUp = (e) => {
      const h = this.held;
      if (!h || (e && e.pointerId !== h.pid)) return;
      this.held = null;
      if (!h.moved) return;
      // 놓은 자리가 새 제자리가 된다. 이 점에 걸린 선의 길이도 거기에 맞춘다
      h.n.hx = h.n.x;
      h.n.hy = h.n.y;
      this.links.forEach((l) => { if (l.a === h.n || l.b === h.n) l.len = Math.hypot(l.b.hx - l.a.hx, l.b.hy - l.a.hy); });
      this.dropped = true;
      setTimeout(() => { this.dropped = false; }, 0);
      this.setState({ drag: false });
    };
    // 끌다가 놓은 직후의 클릭은 글로 이동하지 않는다
    this.nodeClick = (e) => { if (this.dropped) e.preventDefault(); };

    this.onKey = (e) => {
      if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey || this.editing() || typing(e.target)) return;
      if (e.key === 'Escape') {
        if (this.state.graphOpen) { e.preventDefault(); this.closeGraph(); }
        return;
      }
      if (e.shiftKey || e.repeat || this.state.graphOpen) return;
      // 한글 입력 상태에서도 같은 자리의 키로 동작하게 한다
      const ch = e.key && e.key.length === 1 ? e.key.toLowerCase() : '';
      const k = /^[a-z]$/.test(ch) ? ch : e.code === 'KeyB' ? 'b' : e.code === 'KeyC' ? 'c' : '';
      if (k !== 'b' && k !== 'c') return;
      e.preventDefault();
      this.go(k);
    };

    this.closeGraph = () => {
      this.setState({ graphOpen: false, hover: null });
      setTimeout(() => { if (this.openBtn) this.openBtn.focus({ preventScroll: true }); }, 0);
    };

    this.tick = (now) => {
      this.raf = requestAnimationFrame(this.tick);
      // 천천히 떠다니기만 하는 동안에는 두 프레임에 한 번만 계산한다
      this.odd = !this.odd;
      if (this.odd && !this.held && !(this.speed > 0.2)) return;
      const dt = clamp((now - (this.last || now)) / 16.667, 0.25, 3);
      this.last = now;
      this.place(this.step(now, dt));
    };
  }

  componentDidMount() {
    this.reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    this.place(true);
    this.raf = requestAnimationFrame(this.tick);
    // 단축키를 바로 받을 수 있게, 이 문서에 포커스가 와 있는데 받는 요소가 없으면 화면 전체가 받는다.
    // 다른 문서의 포커스를 가져오지는 않는다
    this.onFocus = () => { if (this.rootEl && !this.editing() && document.activeElement === document.body) this.rootEl.focus({ preventScroll: true }); };
    window.addEventListener('focus', this.onFocus);
    if (document.hasFocus()) this.onFocus();
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    clearTimeout(this.navT);
    window.removeEventListener('focus', this.onFocus);
  }

  // 캔버스에서 편집하는 동안에는 단축키와 움직임을 멈춘다
  editing() {
    const b = document.body;
    return b.hasAttribute('data-dc-editor-on') && b.getAttribute('data-dc-editor-tool') !== 'interact';
  }

  // 단축키: 메뉴를 한 번 반전시킨 뒤 그 링크를 누른 것과 똑같이 이동한다
  go(k) {
    if (this.navT) return;
    this.setState({ key: k });
    this.navT = setTimeout(() => {
      this.navT = null;
      this.setState({ key: null });
      if (k === HERE) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      const a = this.rootEl && this.rootEl.querySelector('a[data-key="' + k + '"]');
      if (a) a.click();
    }, 140);
  }

  grab(id, e) {
    if (e.button) return;
    const el = e.currentTarget, box = el.closest('.fig');
    const f = this.figL && this.figL.el === box ? this.figL : this.figS;
    if (!f || !f.m) return;
    const n = this.simOf[id], r = f.el.getBoundingClientRect();
    // 잡은 자리와 점 중심의 차이를 기억해 두어, 잡는 순간 점이 튀지 않게 한다
    this.held = { n, f, pid: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false, dx: n.x - (e.clientX - r.left - f.m.ox) / f.m.kx, dy: n.y - (e.clientY - r.top - f.m.oy) / f.m.ky };
    if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  // 한 프레임만큼 힘을 계산해 점을 옮긴다. 움직인 점이 있으면 true
  step(now, dt) {
    const N = this.sim, held = this.held ? this.held.n : null;
    const calm = (this.reduce && this.reduce.matches) || this.editing();
    this.amp += ((calm ? 0 : AMP) - this.amp) * Math.min(1, 0.03 * dt);
    const amp = this.amp;
    for (let i = 0; i < N.length; i++) {
      const n = N[i];
      const tx = n.hx + amp * (Math.sin(now * n.w1 + n.p1) + 0.45 * Math.sin(now * n.w2 * 1.9 + n.p2));
      const ty = n.hy + amp * (Math.cos(now * n.w2 + n.p2) + 0.45 * Math.sin(now * n.w1 * 1.7 + n.p1 * 1.3));
      n.ax = (tx - n.x) * K_HOME;
      n.ay = (ty - n.y) * K_HOME;
    }
    for (let i = 0; i < this.links.length; i++) {
      const l = this.links[i], dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.hypot(dx, dy) || 0.001, f = (K_LINK * (d - l.len)) / d;
      l.a.ax += dx * f; l.a.ay += dy * f;
      l.b.ax -= dx * f; l.b.ay -= dy * f;
    }
    const R = this.reach;
    for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
      const a = N[i], b = N[j], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 >= R * R) continue;
      const d = Math.sqrt(d2) || 0.001, f = (K_PUSH * (1 - d / R)) / d;
      a.ax -= dx * f; a.ay -= dy * f;
      b.ax += dx * f; b.ay += dy * f;
    }
    const keep = Math.pow(DAMP, dt);
    let far = 0;
    for (let i = 0; i < N.length; i++) {
      const n = N[i];
      if (n === held) { n.vx = 0; n.vy = 0; continue; }
      n.vx = (n.vx + n.ax * dt) * keep;
      n.vy = (n.vy + n.ay * dt) * keep;
      const x = clamp(n.x + n.vx * dt, PAD, SW - PAD), y = clamp(n.y + n.vy * dt, PAD, SH - PAD);
      far = Math.max(far, Math.abs(x - n.x) + Math.abs(y - n.y));
      n.x = x;
      n.y = y;
    }
    this.speed = far / dt; // 가장 빨리 움직인 점의 프레임당 이동 거리
    return !!held || far > 0.003;
  }

  // 계산한 자리를 두 창(작은 창, 크게 본 창)의 점과 선에 옮겨 적는다
  place(moved) {
    const figs = [this.figS, this.figL];
    // 크기는 먼저 한꺼번에 읽는다. 읽기와 쓰기를 섞으면 프레임마다 배치 계산을 다시 하게 된다
    for (let k = 0; k < figs.length; k++) if (figs[k]) { figs[k].cw = figs[k].el.clientWidth; figs[k].ch = figs[k].el.clientHeight; }
    for (let k = 0; k < figs.length; k++) {
      const f = figs[k];
      if (!f) continue;
      const fresh = !f.nodes || !f.nodes.length || !f.nodes[0].isConnected;
      const w = f.cw, h = f.ch;
      if (!w || !h || (!moved && !fresh && w === f.w && h === f.h)) continue;
      if (fresh) { f.nodes = f.el.querySelectorAll('.gn'); f.lines = f.el.querySelectorAll('.gl'); }
      f.w = w;
      f.h = h;
      // 큰 창은 오른쪽에 이름표가 들어갈 자리를 남긴다
      const kx = f.large ? Math.max(60, w - 208) / (SW - 2 * PAD) : w / SW, ky = f.large ? Math.max(60, h - 56) / (SH - 2 * PAD) : h / SH;
      const m = f.m = { kx, ky, ox: f.large ? 28 - PAD * kx : 0, oy: f.large ? 28 - PAD * ky : 0 };
      for (let i = 0; i < this.sim.length; i++) {
        const n = this.sim[i], el = f.nodes[i];
        if (el) el.style.transform = 'translate(' + (m.ox + n.x * kx).toFixed(2) + 'px,' + (m.oy + n.y * ky).toFixed(2) + 'px)';
      }
      for (let i = 0; i < this.links.length; i++) {
        const l = this.links[i], el = f.lines[i];
        if (!el) continue;
        el.setAttribute('x1', (m.ox + l.a.x * kx).toFixed(2));
        el.setAttribute('y1', (m.oy + l.a.y * ky).toFixed(2));
        el.setAttribute('x2', (m.ox + l.b.x * kx).toFixed(2));
        el.setAttribute('y2', (m.oy + l.b.y * ky).toFixed(2));
      }
    }
  }

  renderVals() {
    const s = this.state;
    const typeOn = Object.keys(s.types).filter((k) => s.types[k]);
    const topicOn = Object.keys(s.topics).filter((k) => s.topics[k]);
    const hasFilter = typeOn.length + topicOn.length > 0;
    const match = (p) => (!typeOn.length || !!s.types[p.kind]) && (!topicOn.length || p.topics.some((t) => s.topics[t]));
    const ok = {};
    POSTS.forEach((p) => { ok[p.id] = match(p); });
    const visible = POSTS.filter((p) => ok[p.id]);
    const sorted = visible.slice().sort((a, b) => {
      const c = s.sort === 'date' ? a.date.localeCompare(b.date) : a.title.localeCompare(b.title, 'ko');
      return s.dir === 'asc' ? c : -c;
    });
    let openId = null;
    for (let i = s.order.length - 1; i >= 0 && !openId; i--) if (ok[s.order[i]]) openId = s.order[i];
    const active = s.hover || openId;
    const act = active ? this.byId[active] : null;
    const near = active ? this.adj[active] || {} : {};

    const rows = sorted.map((p) => {
      const open = !!s.open[p.id];
      return {
        date: p.date, title: p.title, summary: p.summary, open,
        tags: [KIND[p.kind]].concat(p.topics),
        cls: (open ? 'open' : '') + (s.anim === p.id ? ' anim' : ''),
        panel: 'xp-' + p.id,
        toggleLabel: (open ? '접기: ' : '펼치기: ') + p.title,
        enter: this.rowEnters[p.id],
        toggle: this.toggles[p.id],
      };
    });

    // 필터와 정렬은 목록을 통째로 바꾼다: 행 펼침 애니메이션은 끄고 목록을 한 번 다시 드러낸다
    const relist = (patch) => (st) => Object.assign({ anim: null, rev: st.rev + 1 }, patch(st));
    const item = (name, key, bag, n) => ({
      name, count: n, on: !!s[bag][key],
      color: s[bag][key] ? 'var(--ink)' : 'var(--ink-2)',
      weight: s[bag][key] ? 500 : 400,
      toggle: () => this.setState(relist((st) => {
        const next = Object.assign({}, st[bag]);
        next[key] = !next[key];
        return bag === 'types' ? { types: next } : { topics: next };
      })),
    });
    const groups = [
      { label: 'Type', cols: 'minmax(0, 1fr)', items: Object.keys(KIND).map((k) => item(KIND[k], k, 'types', POSTS.filter((p) => p.kind === k).length)) },
      { label: 'Topic', cols: 'minmax(0, 1fr) minmax(0, 1fr)', items: TOPICS.map((t) => item(t, t, 'topics', POSTS.filter((p) => p.topics.indexOf(t) >= 0).length)) },
    ];

    // 그래프: 보고 있는 점(hot)과 그 이웃(near). 점에 직접 마우스를 올렸을 때만 그 밖의 점과 선을 흐리게 한다(far, faint).
    // 필터에 걸리지 않은 글은 dim
    const fade = !!s.hover && s.via === 'node';
    const nodes = POSTS.map((p) => {
      const n = this.simOf[p.id];
      const st = p.id === active ? 'hot' : near[p.id] ? 'near' : fade ? 'far' : '';
      return { title: p.title, short: p.short, cls: st + (ok[p.id] ? '' : ' dim'), x0: n.x0, y0: n.y0, down: this.downs[p.id], enter: this.enters[p.id] };
    });
    const edges = this.pairs.map(([a, b]) => ({ cls: active && (a === active || b === active) ? 'hot' : fade || !(ok[a] && ok[b]) ? 'faint' : '' }));

    const N = POSTS.length;
    return {
      rows, groups, nodes, edges, hasFilter,
      count: visible.length,
      noRows: rows.length === 0,
      rowsCls: s.rev ? (s.rev % 2 ? 'a' : 'b') : '',
      shownLabel: hasFilter ? visible.length + ' / ' + N : '',
      dateColor: s.sort === 'date' ? 'var(--ink)' : 'var(--ink-3)',
      nameColor: s.sort === 'name' ? 'var(--ink)' : 'var(--ink-3)',
      dateArrow: s.sort === 'date' ? (s.dir === 'desc' ? '↓' : '↑') : '',
      nameArrow: s.sort === 'name' ? (s.dir === 'desc' ? '↓' : '↑') : '',
      sortDate: () => this.setState(relist((st) => (st.sort === 'date' ? { dir: st.dir === 'desc' ? 'asc' : 'desc' } : { sort: 'date', dir: 'desc' }))),
      sortName: () => this.setState(relist((st) => (st.sort === 'name' ? { dir: st.dir === 'desc' ? 'asc' : 'desc' } : { sort: 'name', dir: 'asc' }))),
      clearFilters: () => this.setState(relist(() => ({ types: {}, topics: {} }))),
      leave: this.leave,
      hasActive: !!act, noActive: !act,
      activeDate: act ? act.date : '', activeTitle: act ? act.title : '',
      graphStat: (hasFilter ? visible.length + ' / ' + N : N) + ' nodes · ' + this.pairs.length + ' links',
      graphOpen: s.graphOpen,
      openGraph: () => this.setState({ graphOpen: true }),
      closeGraph: this.closeGraph,
      stop: (e) => e.stopPropagation(),
      figCls: s.drag ? 'grab' : '',
      figMove: this.figMove, figUp: this.figUp, nodeClick: this.nodeClick,
      setRoot: this.setRoot, setFigS: this.setFigS, setFigL: this.setFigL, setOpenBtn: this.setOpenBtn, setCloseBtn: this.setCloseBtn,
      onKey: this.onKey,
      hitB: s.key === 'b' ? 'hit' : '',
      hitC: s.key === 'c' ? 'hit' : '',
    };
  }
}
</script>
</body>
</html>
