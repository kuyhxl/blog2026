# GitHub Pages 배포. main에 올리면 검사를 모두 통과한 빌드만 배포한다(CLAUDE.md "배포")
# - 순서: npm ci → 린트 → 가짜 볼트 동기화·빌드 → 누출 검사 → 실제 빌드 → out/ 배포
#   누출 검사의 빌드 결과물 검사는 가짜 볼트로 만든 out/이 있어야 돈다. 그 뒤 실제 빌드가 out/을 새로 만든다
# - 권한은 작업마다 필요한 것만 준다. 빌드 작업은 저장소 읽기만 하고, Pages에 올리는 권한은 배포 작업에만 있다
# - 바깥 Action은 커밋 SHA로 고정한다. 판을 올릴 때는 태그가 가리키는 SHA를 확인해 바꾸고, 뒤의 판 주석도 함께 고친다
# - 비밀 값은 없다. 사이트 주소(SITE_URL)는 커밋된 .env.production에 있고, 사용자 도메인은 저장소 Settings → Pages에서 정한다
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# 배포는 한 번에 하나씩. 진행 중인 배포는 끊지 않는다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 판은 mise.toml 한 곳에 둔다
      - id: node
        run: |
          v=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          # 캐시를 쓰지 않는다. 다른 실행이 남긴 캐시가 배포 빌드에 섞이지 않게 한다
          package-manager-cache: false

      # 의존성의 설치 스크립트는 돌리지 않는다(지금 설치 스크립트가 있는 것은 린트 쪽 unrs-resolver 하나이고, 없어도 돈다)
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run sync:fixture
      - run: npm run build:fixture
      - run: npm run test:privacy
      - run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # Pages에 올리기
      id-token: write # 이 저장소의 워크플로가 올리는 것임을 Pages가 확인한다
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
